<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rajeshwar Mobile Run</title><style>*{box-sizing:border-box}body{margin:0;background:#102840;color:white;font:16px system-ui}header{padding:12px;display:flex;justify-content:space-between}a{color:white}main{max-width:540px;margin:auto}canvas{width:100%;height:auto;display:block;touch-action:none}#hud{display:flex;justify-content:space-around;padding:10px}button{border:0;background:#e9a727;color:#142239;border-radius:12px;padding:14px;font:bold 17px system-ui;touch-action:manipulation}nav{display:flex;gap:6px;padding:10px}nav button{flex:1}#start{display:block;margin:10px auto;background:#48dba0}#msg{text-align:center;padding:5px;min-height:30px}body{background:radial-gradient(ellipse at top,#234a69,#091523)}header{background:#0c2034;font-weight:700}#hud{background:#102b44;font-weight:700;letter-spacing:.4px}canvas{border-radius:12px;box-shadow:0 10px 30px #0006}#start{padding:16px 32px;box-shadow:0 4px 15px #48dba044}#end-screen{border-radius:16px;margin:10px}</style><style id="mw-premium-v216">body{background:radial-gradient(ellipse at top,#203e60 0%,#101d32 45%,#080f1e 100%);min-height:100vh}header{border-bottom:1px solid #ffffff24;background:linear-gradient(110deg,#12233e,#25466a);color:#f5f8ff}header a{color:#c5ddff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ffc857;outline-offset:3px}button:not(:disabled){transition:filter .15s,box-shadow .15s}button:not(:disabled):active{filter:brightness(.88)}.stage,.board,canvas:not(.phone canvas){box-shadow:0 12px 32px #0005}footer{color:#b6c9e5}</style><header><a href="./index.html">← MY WORLD</a><b>Rajeshwar Mobile Run</b></header><main><div id="hud"><span id="distance"></span><span id="coins"></span><span id="level"></span></div><canvas id="scene" width="420" height="500"></canvas><div id="msg">Reach Rajeshwar Mobile!</div><section id="end-screen" hidden style="text-align:center;padding:20px;background:#173d60"><h1 id="end-title" style="margin:0;color:#ffce35">GAME OVER</h1><p id="end-score"></p><p>Thank you for using MY WORLD</p><strong>Founded by Mr. Rahul Kumawat</strong></section><button id="start">▶ Start Run</button><p style="text-align:center;padding:10px">Tilt phone ← → • Swipe ↑ Jump • Swipe ↓ Slide</p><p id="motion-status" style="text-align:center;font-size:13px"></p></main><script>const $=id=>document.getElementById(id),c=$('scene'),g=c.getContext('2d');let lane=0,pos=0,meters=0,coin=0,level=1,jump=0,slide=0,objects=[],spawn=0,run=false,last=0,goal=300,best=0;try{best=Number(localStorage.getItem('mw-mobile-run-best')||0)}catch{}function start(){$('end-screen').hidden=true;lane=pos=meters=coin=jump=slide=0;objects=[];spawn=0;run=true;goal=300+(level-1)*150;$('start').hidden=true;$('msg').textContent='Reach the shop • Best '+best+' m'}function input(a){if(!run)return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&!jump&&!slide)jump=.85;if(a==='slide'&&!jump)slide=.8}let baseline=null,filtered=0,motionSeen=false;function tilt(e){if(e.gamma==null)return;motionSeen=true;if(baseline===null){baseline=e.gamma;filtered=0}filtered=.7*filtered+.3*(e.gamma-baseline);if(run){if(filtered>13)lane=1;else if(filtered< -13)lane=-1;else if(Math.abs(filtered)<7)lane=0}$('motion-status').textContent='Motion controls active';}addEventListener('deviceorientation',tilt);$('start').onclick=async()=>{baseline=null;filtered=0;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{if(await DeviceOrientationEvent.requestPermission()!=='granted')$('motion-status').textContent='Motion denied. Swipe left/right instead.'}catch{$('motion-status').textContent='Motion unavailable. Swipe left/right instead.'}}start();if(!motionSeen)$('motion-status').textContent='Hold phone upright. If tilt is unavailable, swipe left/right.'};addEventListener('keydown',e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',' ':'jump'}[e.key];if(a){e.preventDefault();input(a)}});let sx,sy;c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)input(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')};function finish(win){run=false;$('end-screen').hidden=false;$('end-title').textContent=win?'MISSION COMPLETE':'GAME OVER';$('end-score').textContent='Distance: '+Math.floor(meters)+' m • Coins: '+coin;best=Math.max(best,Math.floor(meters));try{localStorage.setItem('mw-mobile-run-best',best)}catch{}$('msg').textContent=win?'🎉 Welcome to Rajeshwar Mobile! Mission complete.':'Obstacle hit! Try again.';$('start').hidden=false;$('start').textContent=win?'Next Mission →':'↻ Retry';if(win)level++}function update(dt){if(!run)return;const speed=65+Math.min(65,(level-1)*8+meters/18);meters+=speed*dt/4;pos+=(lane-pos)*Math.min(1,dt*15);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);spawn-=dt;if(spawn<=0){const l=Math.floor(Math.random()*3)-1;objects.push({lane:l,z:1,kind:['car','pit','gate','barrier'][Math.floor(Math.random()*4)]});objects.push({lane:l===1?0:l+1,z:1,kind:'coin'});spawn=1.05}for(const o of objects){const before=o.z;o.z-=speed*dt/100;if(before>.09&&o.z<=.09&&!o.hit){o.hit=true;if(Math.abs(pos-o.lane)<.48){if(o.kind==='coin')coin+=10;else if(!((o.kind==='pit'||o.kind==='barrier')&&jump>.12)&&!(o.kind==='gate'&&slide>.1)){finish(false);return}}}}objects=objects.filter(o=>o.z>-.15);if(meters>=goal)finish(true)}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function text(t,x,y,size=14,color='white'){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.textAlign='center';g.fillText(t,x,y)}function point(l,z){const p=Math.max(0,1-z);return [210+l*(20+110*p),135+290*p,0.15+p*.85]}function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function shade(x,y,w,h,a,b){const q=g.createLinearGradient(x,y,x+w,y+h);q.addColorStop(0,a);q.addColorStop(1,b);rect(x,y,w,h,q)}function shadow(x,y,w,h){g.fillStyle='rgba(12,22,35,.28)';g.beginPath();g.ellipse(x,y,w,h,0,0,Math.PI*2);g.fill()}function limb(x,y,x2,y2,w,color){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}function draw(){const d=Math.min(3,window.devicePixelRatio||1);if(c.width!==Math.round(420*d)){c.width=Math.round(420*d);c.height=Math.round(500*d)}g.setTransform(d,0,0,d,0,0);shade(0,0,420,500,'#4389c9','#ffe1b5');g.fillStyle='#fff2ca';g.beginPath();g.arc(330,45,28,0,7);g.fill();for(let i=0;i<12;i++){const x=i*40-15,hh=35+(i*31%55);rect(x,135-hh,34,hh,'#7793ac')}rect(0,135,420,365,'#8c9c81');poly([[170,135],[250,135],[420,500],[0,500]],'#c6b9a6');poly([[179,135],[241,135],[400,500],[20,500]],'#394653');for(let j=0;j<22;j++){const z=((j/22)-(meters/55)%1+1)%1;const [x,y,s]=point(0,z);for(const l of [-.5,.5]){const [xx]=point(l,z);rect(xx-1.5*s,y,3*s,18*s,'#f3e4bd')}for(const side of [-1,1]){const xx=210+side*(32+170*s);rect(xx-8*s,y,16*s,5*s,j%2?'#e8e4dc':'#e3a14c')}}for(let j=8;j>=0;j--){const z=((j/9)-(meters/110)%1+1)%1;const p=1-z,s=.12+p*.88;for(const side of [-1,1]){const x=210+side*(48+195*p),y=135+340*p,w=78*s,hh=(100+(j%3)*35)*s;shade(x-w/2,y-hh,w,hh,j%2?'#d7a77d':'#b7c8d7','#64778a');poly([[x+w/2,y-hh],[x+w/2+side*18*s,y-hh-10*s],[x+w/2+side*18*s,y-10*s],[x+w/2,y]],'#617385');for(let k=0;k<3;k++)for(let n=0;n<2;n++)rect(x-w*.35+n*w*.43,y-hh+12*s+k*24*s,w*.25,13*s,'#34566e');rect(x-w*.42,y-20*s,w*.84,20*s,'#263e50')}}for(const o of [...objects].sort((a,b)=>b.z-a.z)){let [x,y,s]=point(o.lane,o.z);shadow(x,y,34*s,8*s);if(o.kind==='coin'){const w=8*s+4*s*Math.abs(Math.sin(meters*.25));g.fillStyle='#f9c74f';g.beginPath();g.ellipse(x,y-23*s,w,13*s,0,0,7);g.fill();g.strokeStyle='#fff2a5';g.lineWidth=2*s;g.stroke()}else if(o.kind==='pit'){g.fillStyle='#111b26';g.beginPath();g.ellipse(x,y,35*s,12*s,0,0,7);g.fill()}else if(o.kind==='gate'){shade(x-35*s,y-72*s,8*s,72*s,'#ffd05c','#a85c17');shade(x+27*s,y-72*s,8*s,72*s,'#ffd05c','#a85c17');shade(x-35*s,y-72*s,70*s,20*s,'#ffcf58','#bd6218')}else if(o.kind==='car'){shade(x-30*s,y-39*s,60*s,39*s,'#f46b5d','#802635');poly([[x-23*s,y-39*s],[x-15*s,y-59*s],[x+15*s,y-59*s],[x+23*s,y-39*s]],'#263f57');rect(x-23*s,y-24*s,12*s,6*s,'#fff1b5');rect(x+11*s,y-24*s,12*s,6*s,'#fff1b5');rect(x-19*s,y-10*s,38*s,5*s,'#a9b6bf')}else{shade(x-34*s,y-34*s,68*s,30*s,'#ffba48','#b45a20');for(let k=0;k<3;k++)poly([[x-30*s+k*22*s,y-4*s],[x-20*s+k*22*s,y-4*s],[x-8*s+k*22*s,y-34*s],[x-18*s+k*22*s,y-34*s]],'#fff0d0')}}const [x,y]=point(pos,0);const lift=jump?Math.sin(jump/.85*Math.PI)*85:0;const phase=meters*.95,bob=run?Math.abs(Math.sin(phase))*4:0;shadow(x,y+14,22,7);g.save();g.translate(x,y-lift-bob);if(slide){g.rotate(-1.05);g.translate(0,-10)}for(const n of [-1,1]){const swing=Math.sin(phase+n*Math.PI/2)*13;limb(n*8,-5,n*10+swing,13,11,'#233b56');limb(n*10+swing,13,n*12-swing,28,9,'#172c44');limb(n*12-swing,28,n*12-swing+7,29,8,'#e5e9ed');limb(n*15,-38,n*23-swing,-19,9,'#b97b52');limb(n*23-swing,-19,n*18+swing,-9,8,'#d59a6b')}shade(-18,-45,36,42,'#38a6e9','#16467f');shade(-12,-38,24,30,'#273b4c','#111e31');rect(-8,-32,16,3,'#75a6c4');g.fillStyle='#d79b70';g.beginPath();g.arc(0,-56,12,0,7);g.fill();g.fillStyle='#252c35';g.beginPath();g.ellipse(0,-61,12,9,0,0,7);g.fill();g.restore();shade(135,85,150,48,'#246fbe','#12375e');text('RAJESHWAR MOBILE',210,103,12);text('DESTINATION',210,119,10,'#f9d36b');$('distance').textContent=Math.floor(meters)+' / '+goal+' m';$('coins').textContent='🪙 '+coin;$('level').textContent='Mission '+level} function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></html>
