<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rajeshwar Mobile Run</title><style>*{box-sizing:border-box}body{margin:0;background:#102840;color:white;font:16px system-ui}header{padding:12px;display:flex;justify-content:space-between}a{color:white}main{max-width:540px;margin:auto}canvas{width:100%;height:auto;display:block;touch-action:none}#hud{display:flex;justify-content:space-around;padding:10px}button{border:0;background:#e9a727;color:#142239;border-radius:12px;padding:14px;font:bold 17px system-ui;touch-action:manipulation}nav{display:flex;gap:6px;padding:10px}nav button{flex:1}#start{display:block;margin:10px auto;background:#48dba0}#msg{text-align:center;padding:5px;min-height:30px}</style><header><a href="./index.html">← MY WORLD</a><b>Rajeshwar Mobile Run</b></header><main><div id="hud"><span id="distance"></span><span id="coins"></span><span id="level"></span></div><canvas id="scene" width="420" height="500"></canvas><div id="msg">Reach Rajeshwar Mobile!</div><button id="start">▶ Start Run</button><nav><button id="left">←</button><button id="jump">Jump ↑</button><button id="slide">Slide ↓</button><button id="right">→</button></nav></main><script>const $=id=>document.getElementById(id),c=$('scene'),g=c.getContext('2d');let lane=0,pos=0,meters=0,coin=0,level=1,jump=0,slide=0,objects=[],spawn=0,run=false,last=0,goal=300,best=0;try{best=Number(localStorage.getItem('mw-mobile-run-best')||0)}catch{}function start(){lane=pos=meters=coin=jump=slide=0;objects=[];spawn=0;run=true;goal=300+(level-1)*150;$('start').hidden=true;$('msg').textContent='Reach the shop • Best '+best+' m'}function input(a){if(!run)return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&!jump&&!slide)jump=.85;if(a==='slide'&&!jump)slide=.8}for(const a of ['left','right','jump','slide'])$(a).onclick=()=>input(a);$('start').onclick=start;addEventListener('keydown',e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',' ':'jump'}[e.key];if(a){e.preventDefault();input(a)}});let sx,sy;c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)input(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')};function finish(win){run=false;best=Math.max(best,Math.floor(meters));try{localStorage.setItem('mw-mobile-run-best',best)}catch{}$('msg').textContent=win?'🎉 Welcome to Rajeshwar Mobile! Mission complete.':'Obstacle hit! Try again.';$('start').hidden=false;$('start').textContent=win?'Next Mission →':'↻ Retry';if(win)level++}function update(dt){if(!run)return;const speed=40+Math.min(40,(level-1)*5+meters/30);meters+=speed*dt/4;pos+=(lane-pos)*Math.min(1,dt*15);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);spawn-=dt;if(spawn<=0){const l=Math.floor(Math.random()*3)-1;objects.push({lane:l,z:1,kind:['car','pit','gate','barrier'][Math.floor(Math.random()*4)]});objects.push({lane:l===1?0:l+1,z:1,kind:'coin'});spawn=1.35}for(const o of objects){const before=o.z;o.z-=speed*dt/100;if(before>.09&&o.z<=.09&&!o.hit){o.hit=true;if(Math.abs(pos-o.lane)<.48){if(o.kind==='coin')coin+=10;else if(!((o.kind==='pit'||o.kind==='barrier')&&jump>.12)&&!(o.kind==='gate'&&slide>.1)){finish(false);return}}}}objects=objects.filter(o=>o.z>-.15);if(meters>=goal)finish(true)}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function text(t,x,y,size=14,color='white'){g.fillStyle=color;g.font='bold '+size+'px system-ui';g.textAlign='center';g.fillText(t,x,y)}function point(l,z){const p=Math.max(0,1-z);return [210+l*(20+110*p),135+290*p,0.15+p*.85]}function draw(){rect(0,0,420,500,'#9ddcff');rect(0,135,420,365,'#b7cb8e');for(let i=0;i<5;i++){let x=i*85;rect(x,58+(i%3)*17,78,90,'#b0b6c4');for(let k=0;k<3;k++)rect(x+8+k*22,86,13,19,'#eff8ff')}g.fillStyle='#4e5664';g.beginPath();g.moveTo(177,135);g.lineTo(243,135);g.lineTo(420,500);g.lineTo(0,500);g.fill();for(let j=0;j<15;j++){let z=((j/15)-(meters/60)%1+1)%1;for(const l of [-.5,.5]){let [x,y,s]=point(l,z);rect(x-2*s,y,4*s,18*s,'#fff')}}for(const o of [...objects].sort((a,b)=>b.z-a.z)){let [x,y,s]=point(o.lane,o.z);if(o.kind==='coin'){g.fillStyle='#ffce35';g.beginPath();g.arc(x,y-16*s,12*s,0,7);g.fill()}else if(o.kind==='pit'){rect(x-36*s,y-6*s,72*s,22*s,'#171e28')}else if(o.kind==='gate'){rect(x-35*s,y-70*s,8*s,70*s,'#f2a327');rect(x+27*s,y-70*s,8*s,70*s,'#f2a327');rect(x-35*s,y-70*s,70*s,20*s,'#f2a327')}else{rect(x-30*s,y-44*s,60*s,44*s,o.kind==='car'?'#d2484b':'#f39323');rect(x-24*s,y-35*s,48*s,13*s,'#dae9f5');if(o.kind==='car'){rect(x-27*s,y-8*s,12*s,12*s,'#242b32');rect(x+15*s,y-8*s,12*s,12*s,'#242b32')}}}const [x,y]=point(pos,0);let lift=jump?Math.sin(jump/.85*Math.PI)*85:0;let h=slide?23:47;rect(x-13,y-lift-h,26,h,'#1765c8');g.fillStyle='#d8a47a';g.beginPath();g.arc(x,y-lift-h-10,11,0,7);g.fill();if(!slide){for(const n of [-1,1]){g.strokeStyle='#182c46';g.lineWidth=9;g.beginPath();g.moveTo(x+n*7,y-lift);g.lineTo(x+n*8+Math.sin(meters*.9+n)*9,y-lift+22);g.stroke()}}rect(143,91,134,41,'#164da3');text('RAJESHWAR MOBILE',210,107,11);text('SHOP • DESTINATION',210,122,9);$('distance').textContent=Math.floor(meters)+' / '+goal+' m';$('coins').textContent='🪙 '+coin;$('level').textContent='Mission '+level}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></html>
