<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b4ba6"><title>Wedding & Engagement Congratulations | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fc;color:#172344;font-family:system-ui,'Noto Sans Devanagari',sans-serif}header{background:#fff;border-bottom:1px solid #e0e7f4;padding:16px;display:flex;justify-content:space-between}a{color:#2257b9;text-decoration:none}main{max-width:1060px;margin:auto;padding:22px 14px}h1{font-size:25px;margin:0 0 6px}p{color:#66738b;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:20px}.panel{background:white;border:1px solid #e1e7f2;border-radius:17px;padding:18px}label{display:block;font-size:13px;font-weight:750;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid #cdd9ee;border-radius:10px;padding:11px;font:inherit}textarea{min-height:70px;resize:vertical}canvas{display:block;width:100%;max-width:480px;margin:auto;box-shadow:0 10px 30px #1a2a4b23;border-radius:8px}button{width:100%;border:0;background:#225ac5;color:white;border-radius:12px;padding:14px;font:700 15px system-ui;margin-top:16px;cursor:pointer}@media(max-width:740px){.layout{grid-template-columns:1fr}}</style></head><body><header><a href="./index.html">← MY WORLD</a><b>💌 Congratulations Letter</b></header><main><h1>Wedding & Engagement Congratulations</h1><p>Couple का नाम बदलें और MY WORLD की ओर से खूबसूरत बधाई पत्र मुफ्त डाउनलोड करें।</p><div class="layout"><section class="panel"><label>Occasion</label><select id="occasion"><option value="wedding">💍 Wedding / शादी</option><option value="engagement">💖 Engagement / सगाई</option></select><label>Couple Name 1 *</label><input id="first" maxlength="55" placeholder="पहला नाम"><label>Couple Name 2 *</label><input id="second" maxlength="55" placeholder="दूसरा नाम"><label>Congratulations Message</label><textarea id="message" maxlength="270" placeholder="आप दोनों को जीवन के नए सफर की हार्दिक शुभकामनाएँ।"></textarea><label>Letter Theme</label><select id="theme"><option value="royal">Royal Blue & Gold</option><option value="rose">Rose Pink</option><option value="green">Elegant Green</option></select><label>Date (optional)</label><input id="date" type="date"><button id="download">⬇ Download Congratulations Letter (PNG)</button><p>Live Preview • Free Download • No Login</p></section><section class="panel"><canvas id="letter" width="900" height="1200" aria-label="Congratulations letter preview"></canvas></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('letter'),g=c.getContext('2d');const themes={royal:['#112954','#d6a54a','#f7f3e9'],rose:['#7c294d','#d88ca7','#fff3f6'],green:['#185a4a','#c2a05a','#f4f9f3']};function text(t,x,y,size,color,weight='700'){g.textAlign='center';g.fillStyle=color;g.font=weight+' '+size+'px system-ui, sans-serif';g.fillText(t,x,y)}function wrap(t,x,y,width,size,color,limit=5){g.font='500 '+size+'px system-ui, sans-serif';const words=String(t).split(/\s+/),lines=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(g.measureText(next).width>width&&line){lines.push(line);line=word}else line=next}if(line)lines.push(line);lines.slice(0,limit).forEach((v,i)=>text(v,x,y+i*(size+15),size,color,'500'))}function render(){const [dark,gold,bg]=themes[$('theme').value];g.fillStyle=bg;g.fillRect(0,0,900,1200);g.strokeStyle=gold;g.lineWidth=7;g.strokeRect(38,38,824,1124);g.lineWidth=2;g.strokeRect(56,56,788,1088);g.fillStyle=dark;g.fillRect(80,80,740,105);text('MY WORLD',450,149,45,'#fff','900');text('✦  CELEBRATING LOVE  ✦',450,254,25,dark,'700');text($('occasion').value==='wedding'?'WEDDING':'ENGAGEMENT',450,335,48,dark,'900');text('CONGRATULATIONS',450,399,33,gold,'800');text('❦',450,486,77,gold,'700');text('Dear Couple',450,553,25,dark,'500');const one=$('first').value.trim()||'Name One',two=$('second').value.trim()||'Name Two';text(one,450,643,49,dark,'800');text('&',450,705,38,gold,'700');text(two,450,767,49,dark,'800');g.beginPath();g.moveTo(210,820);g.lineTo(690,820);g.strokeStyle=gold;g.lineWidth=2;g.stroke();const msg=$('message').value.trim()||($('occasion').value==='wedding'?'आप दोनों को शादी की हार्दिक बधाई! आपका नया जीवन प्यार, खुशियों और विश्वास से भरा रहे।':'आप दोनों को सगाई की हार्दिक बधाई! आपका साथ हमेशा खुशियों और प्यार से भरा रहे।');wrap(msg,450,885,710,25,dark,5);const date=$('date').value;if(date)text(date,450,1044,23,dark,'500');text('With Best Wishes',450,1092,22,dark,'500');text('Cheers, MY WORLD',450,1130,31,gold,'900')}document.querySelectorAll('input,select,textarea').forEach(e=>e.addEventListener('input',render));$('download').addEventListener('click',()=>{if(!$('first').value.trim()||!$('second').value.trim()){alert('दोनों के नाम भरें।');return}render();const a=document.createElement('a');a.download='MY-WORLD-Congratulations-'+$('occasion').value+'.png';a.href=c.toDataURL('image/png');a.click()});render()})();</script></body></html>
