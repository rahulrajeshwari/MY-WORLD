<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1c"><title>RDs-X | MY WORLD Racing</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#edf5ff;font-family:system-ui,-apple-system,Arial,sans-serif;overflow-x:hidden}header{max-width:560px;margin:auto;padding:15px 15px 10px;display:flex;justify-content:space-between;align-items:center}header a{color:#a8bce4;text-decoration:none;font-size:13px}.brand{font-weight:900;letter-spacing:2px;color:#69eaff}.brand span{color:#fff}main{max-width:560px;margin:auto;padding:0 12px 25px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 12px}.stat{background:#121d35;border:1px solid #253a5a;border-radius:13px;padding:9px 11px}.stat small{display:block;color:#95a9c9;font-size:10px;letter-spacing:1px}.stat strong{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}.screen{position:relative;width:100%;max-width:410px;margin:auto;aspect-ratio:3/4.4;max-height:67vh;border:2px solid #244b78;border-radius:19px;overflow:hidden;box-shadow:0 0 40px #147bd022;background:#101a25}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:#070e1dd9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.panel{max-width:300px}.panel .logo{font-size:47px;font-weight:1000;letter-spacing:3px;color:#70eaff;text-shadow:0 0 24px #1f9aff}.panel h2{margin:5px 0 12px;font-size:23px}.panel p{color:#b1c2da;line-height:1.65;font-size:13px}.primary{background:linear-gradient(110deg,#1c9bea,#3c66ff);color:white;border:0;border-radius:13px;padding:13px 28px;font:inherit;font-weight:900;cursor:pointer;margin-top:10px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:410px;margin:13px auto}.steer{border:1px solid #2d5a88;background:#152846;color:#fff;border-radius:15px;width:95px;height:61px;font-size:30px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}.steer:active{background:#1c5a98}.hint{font-size:11px;text-align:center;color:#849bbd}.pause{border:1px solid #2b4262;background:#142239;color:#d6eaff;border-radius:12px;padding:11px 15px;font:inherit;font-size:12px}.footer{text-align:center;color:#6c85a7;font-size:11px;margin-top:12px}@media(max-width:390px){.screen{max-height:61vh}.steer{height:55px;width:83px}} </style></head><body><header><a href="./index.html">← MY WORLD</a><div class="brand">RDs<span>-X</span> 🏎️</div></header><main><div class="hud"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>SPEED</small><strong id="speed">0</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div><div class="screen" id="screen"><canvas id="track" width="360" height="528" aria-label="RDs-X car racing track"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="logo">RDs-X</div><h2 id="headline">NEON RACING</h2><p id="description">Avoid traffic. Survive longer. Beat your high score.<br>Use ◀ ▶ or keyboard arrows.</p><button class="primary" id="start">START RACE ▶</button></div></div></div><div class="controls"><button class="steer" id="left" aria-label="Steer left">◀</button><button class="pause" id="pause">⏸ PAUSE</button><button class="steer" id="right" aria-label="Steer right">▶</button></div><p class="hint">Mobile: hold ◀ ▶ &nbsp;•&nbsp; Laptop: ← → / A D &nbsp;•&nbsp; P to pause</p><div class="footer">MY WORLD • RDs-X Racing</div></main><script>(()=>{'use strict';const canvas=document.getElementById('track'),ctx=canvas.getContext('2d'),W=360,H=528,roadL=50,roadR=310,lanes=[93,180,267],player={x:180,y:440,w:38,h:68},scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),description=document.getElementById('description'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause');let state='ready',score=0,best=0,elapsed=0,spawn=0,traffic=[],last=0,roadOffset=0,keys={left:false,right:false};try{best=Number(localStorage.getItem('rdsx-best'))||0}catch{}bestEl.textContent=best;const rand=(min,max)=>Math.random()*(max-min)+min;function reset(){score=0;elapsed=0;spawn=0;traffic=[];roadOffset=0;player.x=180;keys.left=false;keys.right=false;scoreEl.textContent='0';speedEl.textContent='90'}function start(){reset();state='running';overlay.hidden=true;pauseBtn.textContent='⏸ PAUSE';last=performance.now();requestAnimationFrame(loop)}function pause(){if(state==='running'){state='paused';headline.textContent='PAUSED';description.textContent='Take a break. Your race is waiting.';startBtn.textContent='RESUME ▶';overlay.hidden=false;pauseBtn.textContent='▶ RESUME'}else if(state==='paused'){state='running';overlay.hidden=true;pauseBtn.textContent='⏸ PAUSE';last=performance.now();requestAnimationFrame(loop)}}function gameOver(){state='over';speedEl.textContent='0';const total=Math.floor(score);if(total>best){best=total;bestEl.textContent=best;try{localStorage.setItem('rdsx-best',String(best))}catch{}}headline.textContent='RACE OVER';description.innerHTML='Score: <strong>'+total+'</strong><br>Best: <strong>'+best+'</strong><br>Try again and beat your record!';startBtn.textContent='RACE AGAIN ↻';overlay.hidden=false}function car(x,y,w,h,color,enemy=false){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0009';ctx.fillRect(-w/2+4,-h/2+6,w,h);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,8);ctx.fill();ctx.fillStyle=enemy?'#ffbd8e':'#94eaff';ctx.fillRect(-w*.34,-h*.27,w*.68,h*.20);ctx.fillStyle='#091e37';ctx.fillRect(-w*.32,-h*.01,w*.64,h*.26);ctx.fillStyle=enemy?'#fff4ae':'#ff444c';ctx.fillRect(-w*.40,enemy?h*.35:-h*.43,w*.23,6);ctx.fillRect(w*.17,enemy?h*.35:-h*.43,w*.23,6);ctx.fillStyle='#05080f';ctx.fillRect(-w/2-5,-h*.30,6,17);ctx.fillRect(w/2-1,-h*.30,6,17);ctx.fillRect(-w/2-5,h*.15,6,17);ctx.fillRect(w/2-1,h*.15,6,17);ctx.restore()}function draw(){ctx.fillStyle='#12231c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#232b39';ctx.fillRect(roadL,0,roadR-roadL,H);ctx.fillStyle='#f5e34e';ctx.fillRect(roadL+5,0,3,H);ctx.fillRect(roadR-8,0,3,H);ctx.fillStyle='#e5eafa99';for(let y=-55+roadOffset;y<H;y+=65){ctx.fillRect(136,y,5,35);ctx.fillRect(222,y,5,35)}ctx.fillStyle='#1f5642';for(let y=-35+roadOffset;y<H;y+=65){ctx.fillRect(14,y,14,30);ctx.fillRect(332,y,14,30)}traffic.forEach(t=>car(t.x,t.y,t.w,t.h,t.color,true));car(player.x,player.y,player.w,player.h,'#12b9ff');ctx.fillStyle='#a1f1ff';ctx.font='bold 12px system-ui';ctx.fillText('RDs-X',12,20)}function collision(t){return Math.abs(player.x-t.x)<(player.w+t.w)*.43&&Math.abs(player.y-t.y)<(player.h+t.h)*.43}function loop(now){if(state!=='running')return;const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;const speed=Math.min(500,210+elapsed*8);const steering=270*dt;if(keys.left)player.x-=steering;if(keys.right)player.x+=steering;player.x=Math.max(roadL+25,Math.min(roadR-25,player.x));roadOffset=(roadOffset+speed*dt)%65;spawn+=dt;const gap=Math.max(.55,1.18-elapsed*.008);if(spawn>=gap){spawn=0;const lane=lanes[Math.floor(Math.random()*lanes.length)];traffic.push({x:lane,y:-75,w:38,h:67,color:['#fc5c6b','#ffbc43','#a06cff','#47d5a1'][Math.floor(Math.random()*4)]})}for(const t of traffic){t.y+=speed*dt;if(collision(t)){draw();gameOver();return}}traffic=traffic.filter(t=>t.y<H+90);score+=dt*12;scoreEl.textContent=Math.floor(score);speedEl.textContent=Math.floor(90+elapsed*2.3);draw();requestAnimationFrame(loop)}function press(dir,on){keys[dir]=on}for(const [id,dir] of [['left','left'],['right','right']]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(dir,true)});b.addEventListener('pointerup',()=>press(dir,false));b.addEventListener('pointercancel',()=>press(dir,false));b.addEventListener('lostpointercapture',()=>press(dir,false))}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key.toLowerCase()==='p'&&!e.repeat)pause()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});window.addEventListener('blur',()=>{keys.left=false;keys.right=false;if(state==='running')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});startBtn.addEventListener('click',()=>{if(state==='paused')pause();else start()});pauseBtn.addEventListener('click',pause);draw()})()</script></body></html>
