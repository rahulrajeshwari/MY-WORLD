<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1c3c"><title>Daily Steps | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#1b2e4e;font-family:system-ui,Arial,sans-serif}header{background:#0c1b38;padding:16px;color:white}header div{max-width:780px;margin:auto;display:flex;justify-content:space-between}header a{color:#c1d4f2;text-decoration:none;font-size:13px}main{max-width:780px;margin:auto;padding:17px 12px 35px}.hero{background:linear-gradient(115deg,#17325d,#2d6ac6);border-radius:18px;color:#fff;padding:23px}.hero h1{font-size:26px;margin:0 0 5px}.hero p{font-size:13px;color:#d6e7ff;margin:0}.summary{background:#fff;border:1px solid #dce5f2;border-radius:14px;padding:16px;margin:13px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{font-size:12px;color:#7789a1}.progress{height:10px;border-radius:10px;background:#e8edf5;overflow:hidden;margin:12px 0}.progress span{display:block;background:#2463cb;height:100%;width:0%;transition:width .2s}.item{background:#fff;border:1px solid #dde6f1;border-radius:13px;padding:13px;display:flex;gap:11px;align-items:center;margin-bottom:9px}.emoji{background:#edf3ff;border-radius:11px;padding:11px;font-size:21px}.info{flex:1}.info b{font-size:14px;display:block}.info small{font-size:11px;color:#75869d;line-height:1.6}.time{font-size:11px;font-weight:800;color:#2354a7}.item input{width:20px;height:20px;accent-color:#255dc8}.done b{text-decoration:line-through;color:#8190a5}.btn{border:0;background:#245fc7;color:white;border-radius:10px;padding:10px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.tip{background:#e9f2ff;border-radius:12px;padding:13px;font-size:12px;line-height:1.7;color:#31537f;margin-top:14px}</style></head><body><header><div><a href="./index.html">← MY WORLD</a><b>🌅 DAILY STEPS</b></div></header><main><section class="hero"><h1>MY WORLD Daily Steps</h1><p>सुबह उठना • खाना • पानी • Exercise • सोना</p></section><section class="summary"><div class="row"><div><b>आज की Routine</b><div class="muted" id="date"></div></div><button class="btn" id="reset">Reset Today</button></div><div class="progress"><span id="bar"></span></div><div class="row"><b id="count">0 / 15</b><span class="muted">Daily Progress</span></div></section><div id="tasks"></div><div class="tip">💡 यह एक उदाहरण Routine है। अपनी पढ़ाई, नौकरी, दुकान और नींद के समय के अनुसार इसे बदलकर अपनाएँ। हर किसी के लिए एक ही समय सही नहीं होता।</div></main><script>const tasks=[["06:30","🌅","जल्दी उठना","अलार्म के बाद उठें और दिन की शुरुआत करें"],["06:40","💧","पानी पीना","सुबह प्यास के अनुसार पानी पिएँ"],["06:50","🪥","ब्रश और फ्रेश होना","दाँत साफ करें और तैयार हों"],["07:15","🚶","Walk / हल्की Exercise","15–30 मिनट अपनी क्षमता के अनुसार"],["08:00","🥣","नाश्ता","पौष्टिक नाश्ता करें"],["09:00","🎯","आज के काम की योजना","3 जरूरी काम लिखें"],["11:00","💧","पानी और छोटा ब्रेक","पानी पिएँ और थोड़ा चलें"],["13:00","🍱","दोपहर का खाना","संतुलित भोजन करें"],["15:30","🧘","आराम / स्ट्रेच","स्क्रीन से ब्रेक लें"],["17:00","🍎","शाम का हेल्दी स्नैक","फल या अपनी पसंद का हल्का स्नैक"],["18:00","🏋️","Workout / Outdoor Activity","अपनी जरूरत के अनुसार गतिविधि"],["19:30","🍽️","रात का खाना","समय से भोजन करें"],["20:30","👨‍👩‍👧","परिवार / Personal Time","परिवार या खुद के लिए समय"],["21:30","📵","फोन कम इस्तेमाल करें","सोने से पहले स्क्रीन टाइम घटाएँ"],["22:30","😴","समय पर सोना","पर्याप्त नींद का लक्ष्य रखें"]];const date=new Date();const key='myworld-daily-'+[date.getFullYear(),date.getMonth()+1,date.getDate()].join('-');const dateText=date.toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('date').textContent=dateText;let done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const list=document.getElementById('tasks');function save(){try{localStorage.setItem(key,JSON.stringify(done))}catch{}}function progress(){const n=tasks.filter((_,i)=>done[i]).length;document.getElementById('count').textContent=n+' / '+tasks.length;document.getElementById('bar').style.width=(n/tasks.length*100)+'%'}function render(){list.replaceChildren();tasks.forEach(([time,emoji,title,desc],i)=>{const item=document.createElement('div');item.className='item'+(done[i]?' done':'');const symbol=document.createElement('div');symbol.className='emoji';symbol.textContent=emoji;const info=document.createElement('div');info.className='info';const clock=document.createElement('span');clock.className='time';clock.textContent=time;const name=document.createElement('b');name.textContent=title;const detail=document.createElement('small');detail.textContent=desc;info.append(clock,name,detail);const check=document.createElement('input');check.type='checkbox';check.checked=!!done[i];check.setAttribute('aria-label',title+' पूरा हुआ');check.onchange=()=>{done[i]=check.checked;save();item.classList.toggle('done',check.checked);progress()};item.append(symbol,info,check);list.append(item)});progress()}document.getElementById('reset').onclick=()=>{done={};save();render()};render();</script></body></html>
