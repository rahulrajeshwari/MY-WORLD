<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD Billing</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#17345f;font:15px system-ui}header{background:#174ba5;color:white;padding:20px}header a{color:white;text-decoration:none}main{max-width:850px;margin:auto;padding:14px}section{background:white;border:1px solid #dce5f3;border-radius:16px;padding:16px;margin-bottom:14px}h1,h2{margin:8px 0 14px}label{display:block;font-size:13px;margin:8px 0}input,select,button{font:inherit;padding:11px;border:1px solid #cbd9eb;border-radius:9px;max-width:100%}input,select{width:100%}button{background:#1758bd;color:white;border:0;cursor:pointer}button.secondary{background:#e7efff;color:#174ba5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:end;margin:8px 0}.line button{background:#f1e5e5;color:#a22}small{color:#60738d}.total{font-size:26px;font-weight:700}.record{border-top:1px solid #dce5f3;padding:12px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}#printarea{display:none}@media(max-width:420px){.line{grid-template-columns:1fr 1fr auto}.line label:first-child{grid-column:1/-1}}@media print{body{background:white;color:black}header,main{display:none}#printarea{display:block;padding:20px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:8px;text-align:left}}</style></head><body><header><a href="./index.html">← MY WORLD</a><h1>Smart Billing</h1>Purchase & Sales Management</header><main><section><div class="grid"><div><small>Total Sales</small><div class="total" id="sales">₹0</div></div><div><small>Total Purchase</small><div class="total" id="purchase">₹0</div></div></div></section><section><h2>नया बिल बनाएं</h2><form id="form"><div class="grid"><label>Bill Type<select id="type"><option value="Sales">Sales / बिक्री</option><option value="Purchase">Purchase / खरीद</option></select></label><label>Date<input type="date" id="date" required></label><label>Business Name<input id="business" value="Rajeshwar Mobile" required></label><label>Customer / Supplier Name<input id="party" required></label><label>Mobile Number<input id="mobile" type="tel"></label><label>Payment Mode<select id="mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></label></div><h2>Items</h2><div id="items"></div><button type="button" class="secondary" id="add">+ Add Item</button><div class="grid"><label>Discount ₹<input id="discount" type="number" min="0" step=".01" value="0"></label><label>Amount Paid ₹<input id="paid" type="number" min="0" step=".01" value="0"></label></div><p>Subtotal: <b id="sub"></b></p><p>Grand Total: <span class="total" id="total"></span></p><p>Balance Due: <b id="due"></b></p><button type="submit">Save Bill</button></form></section><section><h2>Bill History</h2><input id="search" placeholder="Search name, bill number, mobile"><label>Filter<select id="filter"><option>All</option><option>Sales</option><option>Purchase</option></select></label><div id="records"></div></section><small>बिल इस डिवाइस के ब्राउज़र में सेव होते हैं। यह सामान्य बिल है, GST tax invoice नहीं। Print से PDF सेव कर सकते हैं।</small></main><div id="printarea"></div><script>(()=>{const $=id=>document.getElementById(id),key='mw-bills-v1',money=n=>'₹'+Number(n).toFixed(2),round=n=>Math.round(n*100)/100;let bills=[];try{bills=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(bills))bills=[]}catch{}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function add(){const d=document.createElement('div');d.className='line';d.innerHTML='<label>Product<input class="name" required placeholder="Item name"></label><label>Qty<input class="qty" type="number" min="1" step="1" value="1" required></label><label>Rate ₹<input class="rate" type="number" min="0" step=".01" required value="0"></label><button type="button" aria-label="Remove item">×</button>';d.querySelector('button').onclick=()=>{if($('items').children.length>1)d.remove();calc()};$('items').append(d)}function calc(){const items=[...$('items').children].map(d=>({name:d.querySelector('.name').value.trim(),qty:Number(d.querySelector('.qty').value),rate:Number(d.querySelector('.rate').value)}));const sub=round(items.reduce((s,i)=>s+i.qty*i.rate,0)),discount=Math.min(sub,Math.max(0,Number($('discount').value))),total=round(sub-discount),paid=Math.max(0,Number($('paid').value)),due=round(Math.max(0,total-paid));$('sub').textContent=money(sub);$('total').textContent=money(total);$('due').textContent=money(due);return{items,sub,discount,total,paid,due}}function render(){for(const t of ['Sales','Purchase'])$(t.toLowerCase()).textContent=money(bills.filter(b=>b.type===t).reduce((s,b)=>s+b.total,0));const q=$('search').value.toLowerCase(),f=$('filter').value;const list=$('records');list.replaceChildren();for(const b of bills.filter(b=>(f==='All'||b.type===f)&&[b.party,b.id,b.mobile].join(' ').toLowerCase().includes(q))){const d=document.createElement('div');d.className='record';const info=document.createElement('div');info.textContent=b.id+' • '+b.type+' • '+b.party+' • '+money(b.total)+' • '+b.date;const btn=document.createElement('button');btn.textContent='Print / PDF';btn.onclick=()=>printBill(b);d.append(info,btn);list.append(d)}if(!list.children.length)list.textContent='कोई बिल नहीं मिला।'}function printBill(b){$('printarea').innerHTML='<h1>'+esc(b.business)+'</h1><h2>'+esc(b.type)+' Bill</h2><p>Bill No: '+esc(b.id)+' | Date: '+esc(b.date)+'</p><p>Customer / Supplier: '+esc(b.party)+' | '+esc(b.mobile)+'</p><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+b.items.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td><td>'+money(i.rate)+'</td><td>'+money(i.qty*i.rate)+'</td></tr>').join('')+'</tbody></table><p>Subtotal: '+money(b.sub)+'</p><p>Discount: '+money(b.discount)+'</p><h2>Total: '+money(b.total)+'</h2><p>Paid: '+money(b.paid)+' | Due: '+money(b.due)+'</p><p>Payment: '+esc(b.mode)+'</p><p>Thank you! • MY WORLD</p>';window.print()}function date(){const d=new Date();$('date').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}$('add').onclick=()=>{add();calc()};$('form').oninput=calc;$('form').onsubmit=e=>{e.preventDefault();const c=calc();if(c.paid>c.total||Number($('discount').value)>c.sub){alert('Discount या Paid amount सही करें।');return}const b={...c,id:'MW-'+Date.now(),type:$('type').value,date:$('date').value,business:$('business').value,party:$('party').value,mobile:$('mobile').value,mode:$('mode').value};try{localStorage.setItem(key,JSON.stringify([b,...bills]))}catch{alert('Bill save नहीं हुआ।');return}bills.unshift(b);render();$('form').reset();$('business').value=b.business;$('items').replaceChildren();add();date();calc();printBill(b)};$('search').oninput=render;$('filter').onchange=render;date();add();calc();render()})();</script></body></html>
