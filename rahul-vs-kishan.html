<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1427"><title>Rahul vs Kishan | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#f2f7ff;font-family:system-ui,Arial,sans-serif}header{max-width:750px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px}header a{color:#a7bad9;text-decoration:none;font-size:13px}.brand{font-weight:900;letter-spacing:1px}.brand b{color:#5de2c7}main{max-width:750px;margin:auto;padding:0 12px 24px}.stats{display:grid;grid-template-columns:1fr 85px 1fr;gap:9px;align-items:center;margin-bottom:12px}.stat{background:#14233d;border:1px solid #29446b;border-radius:12px;padding:9px 12px}.stat label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:1px}.bar{height:9px;background:#31445f;border-radius:20px;overflow:hidden;margin-top:8px}.fill{height:100%;width:100%;background:#45d5a4;transition:width .16s}.enemy .fill{background:#ff6c72}.clock{text-align:center;font-size:24px;font-weight:900}.stage{position:relative;max-width:580px;margin:auto;aspect-ratio:4/5;max-height:67vh;border:2px solid #345879;border-radius:18px;overflow:hidden;background:#162c36;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:#071328e8;display:grid;place-items:center;text-align:center;padding:25px}.overlay[hidden]{display:none}.panel h1{font-size:32px;line-height:1.15;margin:9px 0}.panel h1 span{color:#6ce8d2}.panel p{color:#b2c8e4;font-size:13px;line-height:1.7}.primary{background:linear-gradient(110deg,#13bca8,#2569df);color:#fff;font:inherit;font-weight:900;border:0;border-radius:12px;padding:13px 25px;cursor:pointer;margin-top:8px}.controls{max-width:580px;margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,47px);gap:4px}.move,.fire{border:1px solid #375779;border-radius:12px;background:#1c3552;color:#fff;font-size:23px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}.move[data-dir=up]{grid-column:2;grid-row:1}.move[data-dir=left]{grid-column:1;grid-row:2}.move[data-dir=down]{grid-column:2;grid-row:2}.move[data-dir=right]{grid-column:3;grid-row:2}.move:active,.fire:active{background:#2966a2}.fire{border-radius:50%;height:85px;width:85px;background:#c94c59;border-color:#ed7885;font-size:15px;box-shadow:0 5px 15px #0005}.tip{text-align:center;color:#95a9c8;font-size:11px;margin-top:12px}.footer{text-align:center;color:#728aa9;font-size:11px;margin-top:16px}@media(max-width:370px){.dpad{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,43px)}.fire{height:75px;width:75px}.stage{max-height:60vh}} </style></head><body><header><a href="./index.html">← MY WORLD</a><div class="brand">RAHUL <b>VS</b> KISHAN</div></header><main><div class="stats"><div class="stat"><label><span>RAHUL</span><span id="hp1">100</span></label><div class="bar"><div class="fill" id="bar1"></div></div></div><div class="clock" id="clock">90</div><div class="stat enemy"><label><span>KISHAN</span><span id="hp2">100</span></label><div class="bar"><div class="fill" id="bar2"></div></div></div></div><div class="stage"><canvas id="arena" width="400" height="500" aria-label="Rahul vs Kishan shooting arena"></canvas><div class="overlay" id="overlay"><div class="panel"><div style="font-size:39px">🎯 ⚔️ 🛡️</div><h1 id="heading">RAHUL <span>VS</span> KISHAN</h1><p id="message">Arena Battle • 1 vs 1<br>Move, take cover and shoot Kishan.<br>Defeat Kishan before time runs out!</p><button class="primary" id="start">START BATTLE ▶</button></div></div></div><div class="controls"><div class="dpad"><button class="move" data-dir="up" aria-label="Move up">▲</button><button class="move" data-dir="left" aria-label="Move left">◀</button><button class="move" data-dir="down" aria-label="Move down">▼</button><button class="move" data-dir="right" aria-label="Move right">▶</button></div><button class="fire" id="fire">🔥 FIRE</button></div><p class="tip">Mobile: Direction buttons + FIRE • Laptop: WASD / Arrows + Space</p><div class="footer">MY WORLD • Rahul vs Kishan • Original 2D Arena Battle</div></main><script>(()=>{'use strict';const c=document.getElementById('arena'),ctx=c.getContext('2d'),W=400,H=500,overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),startBtn=document.getElementById('start'),clock=document.getElementById('clock'),hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2'),bar1=document.getElementById('bar1'),bar2=document.getElementById('bar2');const walls=[{x:125,y:130,w:65,h:55},{x:230,y:300,w:70,h:58},{x:32,y:280,w:57,h:50},{x:305,y:100,w:58,h:50}];let player,enemy,bullets=[],sparks=[],keys={up:false,down:false,left:false,right:false,fire:false},state='ready',last=0,elapsed=0,playerCd=0,enemyCd=0;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function collideCircleRect(x,y,r,o){const px=clamp(x,o.x,o.x+o.w),py=clamp(y,o.y,o.y+o.h);return (x-px)**2+(y-py)**2<r*r}function free(x,y,r){return x>r+8&&x<W-r-8&&y>r+8&&y<H-r-8&&!walls.some(o=>collideCircleRect(x,y,r,o))}function move(a,dx,dy){if(free(a.x+dx,a.y,a.r))a.x+=dx;if(free(a.x,a.y+dy,a.r))a.y+=dy}function reset(){player={x:70,y:410,r:17,hp:100};enemy={x:325,y:65,r:17,hp:100};bullets=[];sparks=[];elapsed=0;playerCd=0;enemyCd=1.1;for(const k in keys)keys[k]=false;updateHud()}function updateHud(){hp1.textContent=Math.ceil(Math.max(0,player.hp));hp2.textContent=Math.ceil(Math.max(0,enemy.hp));bar1.style.width=clamp(player.hp,0,100)+'%';bar2.style.width=clamp(enemy.hp,0,100)+'%';clock.textContent=Math.max(0,Math.ceil(90-elapsed))}function start(){reset();state='playing';overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}function end(winner){if(state!=='playing')return;state='over';heading.innerHTML=winner==='Rahul'?'🏆 RAHUL WINS!':winner==='Kishan'?'KISHAN WINS':'DRAW MATCH';message.textContent=winner==='Rahul'?'Victory! You defeated Kishan.':winner==='Kishan'?'Try again and win the next battle!':'Time is up. Battle ended in a draw.';startBtn.textContent='PLAY AGAIN ↻';overlay.hidden=false}function shoot(from,to,owner){const dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy)||1;bullets.push({x:from.x+dx/len*23,y:from.y+dy/len*23,vx:dx/len*380,vy:dy/len*380,owner,life:1.4})}function update(dt){elapsed+=dt;if(elapsed>=90){end(player.hp>enemy.hp?'Rahul':enemy.hp>player.hp?'Kishan':null);return}playerCd-=dt;enemyCd-=dt;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){const n=Math.hypot(dx,dy);move(player,dx/n*170*dt,dy/n*170*dt)}if(keys.fire&&playerCd<=0){shoot(player,enemy,'player');playerCd=.28}const d=dist(player,enemy);if(d>135){const ex=(player.x-enemy.x)/d,ey=(player.y-enemy.y)/d;move(enemy,ex*65*dt,ey*65*dt)}else if(d<95){const ex=(enemy.x-player.x)/d,ey=(enemy.y-player.y)/d;move(enemy,ex*54*dt,ey*54*dt)}if(enemyCd<=0){shoot(enemy,player,'enemy');enemyCd=.85+Math.random()*.4}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(walls.some(o=>collideCircleRect(b.x,b.y,4,o)))b.life=0;const target=b.owner==='player'?enemy:player;if(b.life>0&&Math.hypot(b.x-target.x,b.y-target.y)<target.r+4){target.hp-=b.owner==='player'?12:8;b.life=0;for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2;sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*80,vy:Math.sin(a)*80,life:.35})}}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);updateHud();if(enemy.hp<=0)end('Rahul');else if(player.hp<=0)end('Kishan')}function draw(){ctx.fillStyle='#183a35';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#71dfc255';ctx.lineWidth=4;ctx.strokeRect(7,7,W-14,H-14);for(const o of walls){ctx.fillStyle='#263a55';ctx.fillRect(o.x+4,o.y+5,o.w,o.h);ctx.fillStyle='#657d91';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#9aafbf';ctx.lineWidth=2;ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6)}for(const [a,color,label] of [[player,'#3edbb7','RAHUL'],[enemy,'#fa6971','KISHAN']]){ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(a.x+3,a.y+7,a.r+4,a.r*.65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(label,a.x,a.y-25);const target=a===player?enemy:player;const angle=Math.atan2(target.y-a.y,target.x-a.x);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angle);ctx.fillStyle='#14253e';ctx.fillRect(7,-5,22,10);ctx.restore()}for(const b of bullets){ctx.fillStyle=b.owner==='player'?'#a1fff0':'#ffd0a1';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()}for(const s of sparks){ctx.globalAlpha=s.life/.35;ctx.fillStyle='#ffe58a';ctx.fillRect(s.x-3,s.y-3,6,6)}ctx.globalAlpha=1}function loop(now){if(state!=='playing')return;const dt=Math.min((now-last)/1000,.05);last=now;update(dt);draw();if(state==='playing')requestAnimationFrame(loop)}function setControl(k,on){keys[k]=on}document.querySelectorAll('.move').forEach(btn=>{const dir=btn.dataset.dir;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);setControl(dir,true)});for(const event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>setControl(dir,false))});const fire=document.getElementById('fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fire.setPointerCapture(e.pointerId);keys.fire=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(event,()=>keys.fire=false);function key(e){const k=e.key.toLowerCase();return({arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right',' ':'fire'})[k]}window.addEventListener('keydown',e=>{const k=key(e);if(k){e.preventDefault();keys[k]=true}});window.addEventListener('keyup',e=>{const k=key(e);if(k){e.preventDefault();keys[k]=false}});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});startBtn.addEventListener('click',start);reset();draw()})()</script><script src="./game-sound.js" defer></script></body></html>
