<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD Messenger Beta</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf3fa;color:#17345d;margin:0}main{max-width:600px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd8e8;margin:5px 0;width:100%}button{background:#235dd0;color:white}button:disabled{opacity:.5}#messages{height:300px;overflow:auto}#messages p{padding:10px;background:#edf3fa;border-radius:10px;overflow-wrap:anywhere}#messages .me{background:#d6e6ff;text-align:right}</style></head><body><main><a href="./index.html">← MY WORLD</a><h1>Messenger · Private Beta</h1><p>Verified adults only. Share your chosen ID with trusted testers. Do not send private information. Messages are stored in Firestore, not end-to-end encrypted. No public stranger matching.</p><p id="status">Checking login…</p><section><label>Choose User ID (4–24 lowercase letters, numbers or underscore)<input id="name" maxlength="24"></label><button id="claim" disabled>Register User ID</button><label>Friend's exact User ID<input id="peer" maxlength="24"></label><button id="open" disabled>Open Chat</button></section><section><h2 id="title">Chat</h2><div id="messages"></div><input id="message" maxlength="1000" placeholder="Type message"><button id="send" disabled>Send</button><button id="close">Close chat</button></section></main><script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp,getApps} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,runTransaction,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=getApps()[0]||initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user,room,stop,seq=0;const say=t=>$('status').textContent=t;function close(){seq++;if(stop)stop();stop=null;room=null;$('send').disabled=true;$('messages').replaceChildren();$('message').value='';$('title').textContent='Chat'}$('close').onclick=close;
onAuthStateChanged(auth,u=>{close();user=u?.emailVerified?u:null;$('claim').disabled=$('open').disabled=!user;say(user?'Verified account ready.':'Login and verify email in MY WORLD first.')});
const valid=n=>/^[a-z0-9_]{4,24}$/.test(n);$('claim').onclick=async()=>{const u=user,n=$('name').value.trim().toLowerCase();if(!u||!valid(n))return say('Invalid User ID');try{await runTransaction(db,async t=>{const d=doc(db,'mwUsernames',n),s=await t.get(d);if(s.exists()){if(s.data().uid!==u.uid)throw Error('ID taken');return}t.set(d,{uid:u.uid})});say('Your User ID: '+n)}catch(e){say('ID unavailable or rules not enabled.')}};
$('open').onclick=async()=>{close();const ticket=seq,u=user,n=$('peer').value.trim().toLowerCase();if(!u||!valid(n))return say('Enter valid User ID');try{const p=await getDoc(doc(db,'mwUsernames',n));if(!p.exists()||p.data().uid===u.uid)return say('Friend ID not found or your own ID');const members=[u.uid,p.data().uid].sort();const id=members.map(encodeURIComponent).join('~');const ref=doc(db,'mwChats',id);await runTransaction(db,async t=>{const s=await t.get(ref);if(!s.exists())t.set(ref,{members});else if(JSON.stringify(s.data().members)!==JSON.stringify(members))throw Error('Room mismatch')});if(ticket!==seq||user?.uid!==u.uid)return;room=ref;$('title').textContent='Chat with '+n;stop=onSnapshot(query(collection(ref,'messages'),orderBy('created','desc'),limit(100)),s=>{if(ticket!==seq)return;$('messages').replaceChildren();for(const d of [...s.docs].reverse()){const m=d.data(),p=document.createElement('p');p.className=m.sender===u.uid?'me':'';p.textContent=m.text;$('messages').append(p)}$('messages').scrollTop=$('messages').scrollHeight},()=>{close();say('Chat access denied')});$('send').disabled=false;say('Chat opened') }catch{say('Chat unavailable. Check Firebase rules.')}};
$('send').onclick=async()=>{const r=room,u=user,t=$('message').value.trim();if(!r||!u||!t)return;$('send').disabled=true;try{await addDoc(collection(r,'messages'),{sender:u.uid,text:t,created:serverTimestamp()});if(room===r)$('message').value=''}catch{say('Message not sent')}finally{$('send').disabled=!room}};
</script></body></html>
