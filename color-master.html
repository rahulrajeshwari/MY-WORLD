<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Master | MY WORLD</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29496c,#0b1225 70%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:680px;margin:auto;padding:20px}a{color:#b8d9ff}h1{margin:18px 0 4px}p{color:#c5d4e9}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.stats,.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stats span,button{border:1px solid #526b91;border-radius:14px;padding:12px;background:#223653;color:white;font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#board{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 14px;padding:32px 0;min-height:240px}.tube{position:relative;width:52px;height:145px;padding:4px;border:2px solid #a9c5e3;border-top:0;border-radius:5px 5px 22px 22px;background:linear-gradient(90deg,#ffffff22,transparent 35%,#ffffff15);display:flex;flex-direction:column-reverse;overflow:hidden;transition:transform .22s;box-shadow:0 8px 16px #0005}.tube.selected{transform:translateY(-14px);outline:2px solid #ffd166}.tube.pour{animation:pour .35s ease}.liquid{height:25%;width:100%;flex-shrink:0;background:linear-gradient(90deg,#ffffff55,transparent 35%,#0002),var(--c);border-top:1px solid #ffffff55}.liquid:first-child{border-radius:0 0 15px 15px}.tube:after{content:'';position:absolute;left:7px;top:8px;bottom:14px;width:4px;background:#ffffff50;border-radius:4px;pointer-events:none}@keyframes pour{50%{transform:translateY(-12px) rotate(18deg)}}#message{text-align:center;min-height:48px;color:#ffd166}#next{background:#167b65}button:focus-visible{outline:3px solid #ffd166}small{display:block;text-align:center;color:#aabbd5;margin-top:18px}</style></head><body><main><header><a href="./game.html">← Gaming Arena</a><span>MY WORLD</span></header><h1>Color Master</h1><p>Water Sort Puzzle • एक रंग, एक बोतल</p><div class="stats"><span id="level"></span><span id="moves"></span><span id="coins"></span></div><div id="board"></div><div id="message" role="status"></div><div class="controls"><button id="undo">↶ Undo</button><button id="restart">⟳ Restart</button><button id="hint">💡 Hint</button><button id="extra">＋ Bottle</button><button id="next" hidden>Next Level →</button></div><small>Demo RCoins केवल इस गेम में सेव होते हैं।</small></main><script>
const $=id=>document.getElementById(id),palette=['#ff526d','#28b9ff','#ffd447','#39d98a','#a77bff','#ff963f','#f36ac1','#27d5d1','#b5df43','#a47755'];let saved={};try{saved=JSON.parse(localStorage.getItem('mw-color-master-v1')||'{}')}catch{}let level=Number.isSafeInteger(saved.level)&&saved.level>0?saved.level:1,coins=Number(saved.coins)||0,paid=Number(saved.paid)||0,board=[],initial=[],history=[],selected=-1,moves=0,won=false,extra=false,busy=false;
const copy=x=>x.map(t=>t.slice());function generate(l){let n=Math.min(10,3+Math.floor((l-1)/5)),a=Array.from({length:n+2},(_,i)=>i<n?Array(4).fill(i):[]),seed=(l*2654435761)>>>0;function rnd(m){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed%m}for(let k=0;k<25+n*12;k++){let opts=[];a.forEach((s,i)=>{if(!s.length)return;let c=s.at(-1),run=1;while(run<s.length&&s[s.length-1-run]===c)run++;a.forEach((d,j)=>{if(i===j||d.length===4||(!d.length&&run===s.length))return;for(let q=1;q<=Math.min(run,4-d.length);q++){if(q===s.length||s[s.length-q-1]===c)opts.push([i,j,q])}})});if(!opts.length)break;let [i,j,q]=opts[rnd(opts.length)];a[j].push(...a[i].splice(-q))}return a}
function solved(a){return a.every(t=>!t.length||(t.length===4&&t.every(c=>c===t[0])))}function legal(a,i,j){let s=a[i],d=a[j];return i!==j&&s.length&&d.length<4&&(!d.length||d.at(-1)===s.at(-1))}function transfer(a,i,j){let c=a[i].at(-1);while(legal(a,i,j)&&a[i].at(-1)===c)a[j].push(a[i].pop())}function save(){try{localStorage.setItem('mw-color-master-v1',JSON.stringify({level,coins,paid,board,moves,extra,won}))}catch{}}function reward(){return level<=10?5:level<=25?10:level<=50?15:level<=100?25:50}function render(){ $('level').textContent='Level '+level;$('moves').textContent='Moves '+moves;$('coins').textContent='🪙 '+coins+' Demo';$('board').replaceChildren();board.forEach((t,i)=>{let b=document.createElement('button');b.className='tube'+(selected===i?' selected':'');b.setAttribute('aria-label','Bottle '+(i+1)+': '+t.map(c=>['red','blue','yellow','green','purple','orange','pink','cyan','lime','brown'][c]).join(', '));b.onclick=()=>tap(i);t.forEach(c=>{let x=document.createElement('span');x.className='liquid';x.style.setProperty('--c',palette[c]);b.append(x)});$('board').append(b)});$('next').hidden=!won;$('undo').disabled=won||!history.length;$('extra').disabled=won||extra;$('hint').disabled=won;save()}function start(){initial=generate(level);board=copy(initial);moves=0;history=[];selected=-1;won=false;extra=false;$('message').textContent='पहली बोतल चुनें, फिर दूसरी बोतल।';render()}function tap(i){if(won||busy)return;if(selected===i){selected=-1;render();return}if(selected<0){if(board[i].length)selected=i;render();return}if(!legal(board,selected,i)){$('message').textContent='सिर्फ समान रंग या खाली बोतल में डालें।';selected=board[i].length?i:-1;render();return}let from=selected;history.push(copy(board));transfer(board,from,i);moves++;selected=-1;won=solved(board);if(won){let gain=0;if(paid<level){gain=reward();coins+=gain;paid=level}$('message').textContent='🎉 Level Complete! +'+gain+' Demo RCoins'}else $('message').textContent='बहुत बढ़िया!';render();$('board').children[from].classList.add('pour')}
$('undo').onclick=()=>{if(history.length&&!won){board=history.pop();moves=Math.max(0,moves-1);selected=-1;extra=board.length>initial.length;render()}};$('restart').onclick=start;$('next').onclick=()=>{if(won){level++;start()}};$('extra').onclick=()=>{if(!extra&&!won){history.push(copy(board));board.push([]);extra=true;render()}};$('hint').onclick=()=>{for(let i=0;i<board.length;i++)for(let j=0;j<board.length;j++)if(legal(board,i,j)&&board[j].length){selected=i;render();$('message').textContent='बोतल '+(i+1)+' से '+(j+1)+' में रंग डालकर देखें।';return}for(let i=0;i<board.length;i++)for(let j=0;j<board.length;j++)if(legal(board,i,j)&&!board[j].length&&new Set(board[i]).size>1){selected=i;render();$('message').textContent='बोतल '+(i+1)+' से '+(j+1)+' में रंग डालकर देखें।';return}$('message').textContent='Undo, Restart या Extra Bottle इस्तेमाल करें।'};
initial=generate(level);if(Array.isArray(saved.board)&&saved.board.length>=initial.length&&saved.board.length<=initial.length+1&&saved.board.every(t=>Array.isArray(t)&&t.length<=4&&t.every(c=>Number.isInteger(c)&&c>=0&&c<palette.length))){board=copy(saved.board);moves=Number(saved.moves)||0;extra=board.length>initial.length;won=solved(board);$('message').textContent=won?'🎉 Level Complete!':'अपना गेम जारी रखें।';render()}else start();
</script></body></html>
