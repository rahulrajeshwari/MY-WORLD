<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Master | MY WORLD</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29496c,#0b1225 70%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:680px;margin:auto;padding:20px}a{color:#b8d9ff}h1{margin:18px 0 4px}p{color:#c5d4e9}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.stats,.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stats span,button{border:1px solid #526b91;border-radius:14px;padding:12px;background:#223653;color:white;font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#board{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 14px;padding:32px 0;min-height:240px}.tube{position:relative;width:52px;height:145px;padding:4px;border:2px solid #a9c5e3;border-top:0;border-radius:5px 5px 22px 22px;background:linear-gradient(90deg,#ffffff22,transparent 35%,#ffffff15);display:flex;flex-direction:column-reverse;overflow:hidden;transition:transform .22s;box-shadow:0 8px 16px #0005}.tube.selected{transform:translateY(-14px);outline:2px solid #ffd166}.tube.pour{animation:pour .35s ease}.liquid{height:25%;width:100%;flex-shrink:0;background:linear-gradient(90deg,#ffffff55,transparent 35%,#0002),var(--c);border-top:1px solid #ffffff55}.liquid:first-child{border-radius:0 0 15px 15px}.tube:after{content:'';position:absolute;left:7px;top:8px;bottom:14px;width:4px;background:#ffffff50;border-radius:4px;pointer-events:none}@keyframes pour{50%{transform:translateY(-12px) rotate(18deg)}}#message{text-align:center;min-height:48px;color:#ffd166}#next{background:#167b65}button:focus-visible{outline:3px solid #ffd166}small{display:block;text-align:center;color:#aabbd5;margin-top:18px} .tube{width:54px;height:154px;border:0;border-radius:0;overflow:visible;background:none;padding:0;box-shadow:none;display:block;transition:transform .25s}.tube:after{display:none}.tube.selected{outline:none;filter:drop-shadow(0 0 9px #ffda83);transform:translateY(-10px)}.glass{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.tube.complete{filter:drop-shadow(0 0 6px #ffd77a)}#board{gap:24px 13px;padding:55px 0 32px}.vip{color:#f6d58c;letter-spacing:3px;font-size:11px}h1{color:#ffe4a6;text-shadow:0 2px 18px #d4a84d55}.stats span,.controls button{border-color:#a88b525e;background:linear-gradient(145deg,#263650,#101a2c)}.pour-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:visible}.floating-bottle{position:fixed;z-index:10000;pointer-events:none;transform-origin:50% 12%;margin:0;transition:none}.tube.receiving{filter:drop-shadow(0 0 8px #ffffff66)}#sound{padding:8px;font-size:13px} </style></head><body><main><header><a href="./game.html">← Gaming Arena</a><button id="sound" aria-pressed="true">🔊 Sound</button></header><div class="vip">MY WORLD • VIP EDITION</div><h1>Color Master</h1><p>Water Sort Puzzle • एक रंग, एक बोतल</p><div class="stats"><span id="level"></span><span id="moves"></span><span id="coins"></span></div><div id="board"></div><div id="message" role="status"></div><div class="controls"><button id="undo">↶ Undo</button><button id="restart">⟳ Restart</button><button id="hint">💡 Hint</button><button id="extra">＋ Bottle</button><button id="next" hidden>Next Level →</button></div><small>Demo RCoins केवल इस गेम में सेव होते हैं।</small></main><script>
const $=id=>document.getElementById(id),palette=['#ff526d','#28b9ff','#ffd447','#39d98a','#a77bff','#ff963f','#f36ac1','#27d5d1','#b5df43','#a47755'];let saved={};try{saved=JSON.parse(localStorage.getItem('mw-color-master-v1')||'{}')}catch{}let level=Number.isSafeInteger(saved.level)&&saved.level>0?saved.level:1,coins=Number(saved.coins)||0,paid=Number(saved.paid)||0,board=[],initial=[],history=[],selected=-1,moves=0,won=false,extra=false,busy=false;
const copy=x=>x.map(t=>t.slice());function generate(l){let n=Math.min(10,3+Math.floor((l-1)/2)),seed=(l*2654435761)>>>0;function rnd(m){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return Math.floor(seed/4294967296*m)}let best=null,score=-1;for(let attempt=0;attempt<8;attempt++){let a=Array.from({length:n+2},(_,i)=>i<n?Array(4).fill(i):[]),seen=new Set([JSON.stringify(a)]);for(let k=0;k<Math.min(100,8+l*3+n*4);k++){let opts=[];a.forEach((src,i)=>{if(!src.length)return;let c=src.at(-1),run=1;while(run<src.length&&src[src.length-1-run]===c)run++;a.forEach((dst,j)=>{if(i===j||dst.length===4)return;for(let q=1;q<=Math.min(run,4-dst.length);q++){let test=copy(a);test[j].push(...test[i].splice(-q));let key=JSON.stringify(test);if(seen.has(key))continue;let back=copy(test);transfer(back,j,i);if(JSON.stringify(back)!==JSON.stringify(a))continue;let mix=test.reduce((v,t)=>v+Math.max(0,new Set(t).size-1),0);opts.push({test,key,mix})}})});if(!opts.length)break;opts.sort((x,y)=>y.mix-x.mix);let pick=opts[rnd(Math.min(opts.length,Math.max(2,Math.floor(opts.length/3))))];a=pick.test;seen.add(pick.key);let value=pick.mix*10+a.filter(t=>new Set(t).size>1).length;if(value>score){best=copy(a);score=value}}}if(best&&!solved(best))return best;let a=Array.from({length:n+2},(_,i)=>i<n?Array(4).fill(i):[]);a[0]=[0,0,0,1];a[1]=[1,1,1,0];return a}
function solved(a){return a.every(t=>!t.length||(t.length===4&&t.every(c=>c===t[0])))}function legal(a,i,j){let s=a[i],d=a[j];return i!==j&&s.length&&d.length<4&&(!d.length||d.at(-1)===s.at(-1))}function transfer(a,i,j){let c=a[i].at(-1);while(legal(a,i,j)&&a[i].at(-1)===c)a[j].push(a[i].pop())}function save(){try{localStorage.setItem('mw-color-master-v1',JSON.stringify({level,coins,paid,board,moves,extra,won}))}catch{}}function reward(){return level<=10?5:level<=25?10:level<=50?15:level<=100?25:50}function render(){ $('level').textContent='Level '+level+' • '+new Set(initial.flat()).size+' Colors';$('moves').textContent='Moves '+moves;$('coins').textContent='🪙 '+coins+' Demo';$('board').replaceChildren();board.forEach((t,i)=>{let b=document.createElement('button');b.className='tube'+(selected===i?' selected':'');b.setAttribute('aria-label','Bottle '+(i+1)+': '+t.map(c=>['red','blue','yellow','green','purple','orange','pink','cyan','lime','brown'][c]).join(', '));b.onclick=()=>tap(i);b.innerHTML=glass(t,i);if(t.length===4&&t.every(c=>c===t[0]))b.classList.add('complete');$('board').append(b)});$('next').hidden=!won;$('undo').disabled=won||!history.length;$('extra').disabled=won||extra;$('hint').disabled=won;save()}function start(){initial=generate(level);board=copy(initial);moves=0;history=[];selected=-1;won=false;extra=false;$('message').textContent='पहली बोतल चुनें, फिर दूसरी बोतल।';render()}async function tap(i){if(won||busy)return;unlockSound();if(selected===i){selected=-1;render();return}if(selected<0){if(board[i].length){selected=i;tone(520,.07)}render();return}if(!legal(board,selected,i)){$('message').textContent='सिर्फ समान रंग या खाली बोतल में डालें।';selected=board[i].length?i:-1;render();return}let from=selected;busy=true;let after=copy(board);transfer(after,from,i);try{await animatePour(from,i,after)}finally{busy=false}history.push(copy(board));board=after;moves++;selected=-1;won=solved(board);if(won){let gain=0;if(paid<level){gain=reward();coins+=gain;paid=level}$('message').textContent='🎉 Level Complete! +'+gain+' Demo RCoins'}else $('message').textContent='बहुत बढ़िया!';render();if(won){tone(660,.15);setTimeout(()=>tone(880,.22),150)}}
$('undo').onclick=()=>{if(history.length&&!won&&!busy){board=history.pop();moves=Math.max(0,moves-1);selected=-1;extra=board.length>initial.length;render()}};$('restart').onclick=()=>{if(!busy)start()};$('next').onclick=()=>{if(won&&!busy){level++;start()}};$('extra').onclick=()=>{if(!extra&&!won&&!busy){history.push(copy(board));board.push([]);extra=true;render()}};$('hint').onclick=()=>{if(busy)return;for(let i=0;i<board.length;i++)for(let j=0;j<board.length;j++)if(legal(board,i,j)&&board[j].length){selected=i;render();$('message').textContent='बोतल '+(i+1)+' से '+(j+1)+' में रंग डालकर देखें।';return}for(let i=0;i<board.length;i++)for(let j=0;j<board.length;j++)if(legal(board,i,j)&&!board[j].length&&new Set(board[i]).size>1){selected=i;render();$('message').textContent='बोतल '+(i+1)+' से '+(j+1)+' में रंग डालकर देखें।';return}$('message').textContent='Undo, Restart या Extra Bottle इस्तेमाल करें।'};

let audio=null,sound=true;try{sound=localStorage.getItem('mw-color-sound')!=='off'}catch{}function soundLabel(){$('sound').textContent=sound?'🔊 Sound':'🔇 Sound';$('sound').setAttribute('aria-pressed',String(sound))}soundLabel();$('sound').onclick=()=>{sound=!sound;try{localStorage.setItem('mw-color-sound',sound?'on':'off')}catch{}soundLabel();if(sound){unlockSound();tone(620,.1)}};function unlockSound(){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}function tone(f,d){if(!sound||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start();o.stop(t+d)}catch{}}function waterSound(ms){if(!sound||!audio)return;try{let n=Math.ceil(audio.sampleRate*ms/1000),b=audio.createBuffer(1,n,audio.sampleRate),x=b.getChannelData(0),v=0;for(let i=0;i<n;i++){v=.84*v+.16*(Math.random()*2-1);x[i]=v*(.65+.35*Math.sin(i/audio.sampleRate*48))}let src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain(),t=audio.currentTime;src.buffer=b;f.type='bandpass';f.frequency.value=1150;f.Q.value=.65;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.65,t+.07);g.gain.linearRampToValueAtTime(.001,t+ms/1000);src.connect(f).connect(g).connect(audio.destination);src.start();for(let j=0;j<ms/110;j++){let o=audio.createOscillator(),a=audio.createGain(),q=t+j*.11;o.frequency.setValueAtTime(280+Math.random()*230,q);o.frequency.exponentialRampToValueAtTime(750,q+.075);a.gain.setValueAtTime(.025,q);a.gain.exponentialRampToValueAtTime(.001,q+.075);o.connect(a).connect(audio.destination);o.start(q);o.stop(q+.08)}}catch{}}
let serial=0;function glass(t,i,units=t.length){let id='g'+(++serial),layers=t.map((c,k)=>{let h=Math.max(0,Math.min(1,units-k))*25;return '<rect x="8" y="'+(132-k*25-h)+'" width="38" height="'+h+'" fill="'+palette[c]+'"/><rect x="8" y="'+(132-k*25-h)+'" width="38" height="'+h+'" fill="url(#'+id+'w)"/>'}).join('');return '<svg class="glass" viewBox="0 0 54 154" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="'+id+'c"><path d="M18 14H36V30Q46 38 46 48V116Q46 134 27 134Q8 134 8 116V48Q8 38 18 30Z"/></clipPath><linearGradient id="'+id+'w"><stop stop-color="#fff" stop-opacity=".42"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset=".8" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient><linearGradient id="'+id+'m"><stop stop-color="#9a763b"/><stop offset=".45" stop-color="#fff0b6"/><stop offset="1" stop-color="#a17a39"/></linearGradient></defs><path d="M18 14H36V30Q46 38 46 48V116Q46 134 27 134Q8 134 8 116V48Q8 38 18 30Z" fill="#b7d8ff" fill-opacity=".09" stroke="#d9e9ff" stroke-width="1.6"/><g clip-path="url(#'+id+'c)">'+layers+'</g><path d="M13 49V112Q13 122 18 125" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/><path d="M41 49V110" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/><rect x="15" y="8" width="24" height="8" rx="3" fill="url(#'+id+'m)"/><ellipse cx="27" cy="8" rx="11" ry="3" fill="#18243a" stroke="#ffe4a6" stroke-width="1.5"/><path d="M12 139Q27 145 42 139" stroke="#d8b46b" stroke-opacity=".65" fill="none" stroke-width="2"/><text x="27" y="153" text-anchor="middle" fill="#d8b46b" font-size="9">'+(i+1)+'</text></svg>'}
async function animatePour(from,to,after){let a=$('board').children[from],b=$('board').children[to];a.classList.remove('selected');let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),f=a.cloneNode(true);f.className='tube floating-bottle';f.style.cssText='left:'+ar.left+'px;top:'+ar.top+'px;width:'+ar.width+'px;height:'+ar.height+'px';document.body.append(f);a.style.visibility='hidden';b.classList.add('receiving');let dir=br.left>=ar.left?1:-1,dx=br.left-ar.left-dir*13,dy=br.top-ar.top-28,angle=-dir*108;let layer=document.createElementNS('http://www.w3.org/2000/svg','svg');layer.setAttribute('class','pour-layer');layer.setAttribute('width','100%');layer.setAttribute('height','100%');document.body.append(layer);let path=document.createElementNS(layer.namespaceURI,'path');path.setAttribute('fill','none');path.setAttribute('stroke',palette[board[from].at(-1)]);path.setAttribute('stroke-width','5');path.setAttribute('stroke-linecap','round');layer.append(path);let pose='translate('+dx+'px,'+dy+'px) rotate('+angle+'deg)';try{await f.animate([{transform:'none'},{transform:pose}],{duration:350,fill:'forwards',easing:'ease-in-out'}).finished;let x=br.left+br.width/2,y=br.top+8, sx=x-dir*13,sy=y-28;path.setAttribute('d','M'+sx+' '+sy+' Q'+x+' '+(sy+10)+' '+x+' '+y);let count=board[from].length-after[from].length,ms=430+count*220;waterSound(ms);await new Promise(resolve=>{let begin=performance.now();function frame(now){let p=Math.min(1,(now-begin)/ms);f.innerHTML=glass(board[from],from,board[from].length-count*p);b.innerHTML=glass(after[to],to,board[to].length+count*p);if(p<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});path.remove();await f.animate([{transform:pose},{transform:'none'}],{duration:330,fill:'forwards',easing:'ease-in-out'}).finished}finally{f.remove();layer.remove();a.style.visibility='';b.classList.remove('receiving')}}

initial=generate(level);if(Array.isArray(saved.board)&&saved.board.length>=initial.length&&saved.board.length<=initial.length+1&&new Set(saved.board.flat()).size===new Set(initial.flat()).size&&saved.board.every(t=>Array.isArray(t)&&t.length<=4&&t.every(c=>Number.isInteger(c)&&c>=0&&c<palette.length))){board=copy(saved.board);moves=Number(saved.moves)||0;extra=board.length>initial.length;won=solved(board);$('message').textContent=won?'🎉 Level Complete!':'अपना गेम जारी रखें।';render()}else start();
</script></body></html>
