<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD Hill Racing 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#101c30;color:#fff;font:15px system-ui}main{max-width:900px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}a{color:#b8d9ff}h1{font-size:20px;margin:0}button,select{font:inherit;border:0;border-radius:12px;padding:10px;background:#263b59;color:white}button{cursor:pointer}button:disabled{opacity:.5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px}.hud div{background:#20334e;padding:8px;border-radius:10px;text-align:center}.hud b{display:block;font-size:19px}.hud small{color:#b8c9e0}canvas{width:100%;display:block;aspect-ratio:800/420;touch-action:none}#fuelbar{height:7px;background:#344761}#fuelbar div{height:100%;background:#52e18b}#msg{text-align:center;min-height:24px;margin:8px}.controls{display:flex;gap:14px;padding:10px}.pedal{flex:1;min-height:70px;font-size:22px;font-weight:900;touch-action:none;user-select:none;box-shadow:inset 0 -5px #0004}.pedal:active{transform:translateY(3px)}#gas{background:#27b66e}#brake{background:#e45a48}.garage{margin:10px;padding:14px;background:#20334e;border-radius:16px}.garage h2{margin:0 0 8px;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{background:#385679}small{color:#c1d0e4}#start{background:#ffca47;color:#17243b;font-weight:800}#pause{background:#385679}</style><style id="mw-premium-v216">body{background:radial-gradient(ellipse at top,#203e60 0%,#101d32 45%,#080f1e 100%);min-height:100vh}header{border-bottom:1px solid #ffffff24;background:linear-gradient(110deg,#12233e,#25466a);color:#f5f8ff}header a{color:#c5ddff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ffc857;outline-offset:3px}button:not(:disabled){transition:filter .15s,box-shadow .15s}button:not(:disabled):active{filter:brightness(.88)}.stage,.board,canvas:not(.phone canvas){box-shadow:0 12px 32px #0005}footer{color:#b6c9e5}.hud div,.garage{background:linear-gradient(145deg,#294665,#15263d);border:1px solid #496584}.pedal{border:1px solid #ffffff55;letter-spacing:1px}.controls{padding:14px}.garage{box-shadow:0 10px 24px #0005}</style></head><body><main><header><a href="./game.html">← Games</a><h1>HILL RACING 2.0</h1><button id="sound" aria-pressed="false">🔇</button></header><div class="hud"><div><small>DISTANCE</small><b id="dist">0 m</b></div><div><small>RUN COINS</small><b id="coins">0</b></div><div><small>FUEL</small><b id="fuel">100%</b></div><div><small>BEST</small><b id="best">0 m</b></div></div><div id="fuelbar"><div id="fill"></div></div><canvas id="c" width="800" height="420" aria-label="Hill racing game"></canvas><p id="msg" role="status">Choose a track and start your race!</p><div class="controls"><button class="pedal" id="brake">◀ BRAKE</button><button class="pedal" id="gas">GAS ▶</button></div><div class="row" style="justify-content:center"><button id="start">▶ Start / Restart</button><button id="pause">Pause</button><select id="track" aria-label="Track"><option value="0">Green Hills</option><option value="1">Desert Rally</option><option value="2">Snow Peaks</option></select></div><section class="garage"><h2>🏆 Garage & Upgrades</h2><p>🪙 Game Wallet: <b id="wallet">0</b> • Mission: <span id="mission"></span></p><div class="row"><button id="engine"></button><button id="grip"></button><button id="tank"></button><button id="paint">Change car color</button></div><p><small>Collect coins and fuel, land jumps safely, and reach distance milestones. Game coins are local, not RCoin or cash. Keyboard: ← / →.</small></p></section></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let save={wallet:0,best:0,engine:0,grip:0,tank:0,paint:0};try{const old=JSON.parse(localStorage.getItem('mw-hill-v2')||'{}');for(const k of Object.keys(save))if(Number.isFinite(old[k])&&old[k]>=0)save[k]=Math.floor(old[k]);save.best=Math.max(save.best,Number(localStorage.getItem('mw-hill-best'))||0)}catch{}for(const k of ['engine','grip','tank'])save[k]=Math.min(5,save[k]);save.paint%=4;const colors=['#ef4444','#27a9ff','#ffc447','#a78bfa'];const persist=()=>{try{localStorage.setItem('mw-hill-v2',JSON.stringify(save))}catch{}};let x=0,y=0,v=0,vy=0,a=0,av=0,fuel=100,coins=0,gas=false,brake=false,running=false,paused=false,track=0,taken=new Set(),mission=100,air=0,particles=[],sound=false,ctx,osc,gain;const themes=[['#7ed5ff','#e5f8ff','#87bfa4','#467b64','#437e35','#92613c'],['#ffb66d','#fff0c5','#d7a46b','#a96d4d','#d4a04c','#95613c'],['#91b7e8','#f0f8ff','#a1bdd9','#6c8cae','#f5f9ff','#6f879e']];const ground=p=>300+(track===1?50:track===2?58:40)*Math.sin(p/135)+23*Math.sin(p/65)+12*Math.sin(p/33);const slope=p=>(ground(p+2)-ground(p-2))/4;function garage(){ $('wallet').textContent=save.wallet;for(const k of ['engine','grip','tank']){const cost=100*(save[k]+1);$(k).textContent=k[0].toUpperCase()+k.slice(1)+' Lv '+save[k]+(save[k]===5?' MAX':' • '+cost+' 🪙');$(k).disabled=save[k]===5||save.wallet<cost}}function award(n){coins+=n;save.wallet+=n;persist();garage()}function reset(){track=Number($('track').value);x=0;y=ground(0)-25;v=vy=av=0;a=Math.atan(slope(0));fuel=100;coins=0;mission=100;air=0;particles=[];taken.clear();gas=brake=false;running=true;paused=false;$('pause').textContent='Pause';$('msg').textContent='Hold GAS • Collect coins • Reach 100 m!'}function stop(t){running=false;gas=brake=false;save.best=Math.max(save.best,Math.floor(x/10));persist();$('msg').textContent=t+' • '+coins+' coins earned!';garage()}function audio(){if(!sound)return;try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='triangle';gain.gain.value=0;osc.connect(gain).connect(ctx.destination);osc.start()}ctx.resume()}catch{}}$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));if(sound)audio();else if(gain)gain.gain.value=0};function chime(){if(!sound||!ctx)return;const o=ctx.createOscillator(),q=ctx.createGain();o.frequency.value=880;q.gain.setValueAtTime(.07,ctx.currentTime);q.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.13);o.connect(q).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.14)}for(const k of ['engine','grip','tank'])$(k).onclick=()=>{const cost=100*(save[k]+1);if(save[k]<5&&save.wallet>=cost){save.wallet-=cost;save[k]++;persist();garage()}};$('paint').onclick=()=>{save.paint=(save.paint+1)%colors.length;persist()};$('start').onclick=()=>{audio();reset()};$('pause').onclick=()=>{if(running){paused=!paused;gas=brake=false;$('pause').textContent=paused?'Resume':'Pause';$('msg').textContent=paused?'Paused':'Race resumed'}};function bind(id,set){const b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!running)reset();audio();set(true)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>set(false)}bind('gas',v=>gas=v);bind('brake',v=>brake=v);addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.matches('select,button'))return;e.preventDefault();if(!running)reset();if(e.key==='ArrowRight')gas=true;else brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowRight')gas=false;if(e.key==='ArrowLeft')brake=false});addEventListener('blur',()=>{gas=brake=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){gas=brake=false;if(running){paused=true;$('pause').textContent='Resume'}if(gain)gain.gain.value=0}});function step(dt){if(!running||paused)return;const sl=slope(x),touch=y>=ground(x)-26;if(touch){v+=(gas?220+save.engine*28:0)*dt-(brake?350:0)*dt+sl*95*dt;v*=Math.pow(.985,dt*60);v=Math.max(0,Math.min(340+save.engine*35,v));av+=(Math.atan(sl)-a)*(28+save.grip*5)*dt;av*=Math.pow(.84,dt*60);if(gas&&v>30&&Math.random()<.4)particles.push({x:x-35,y:y+20,t:.5})}else{air+=dt;av+=((gas?1.5:0)-(brake?2:0))*dt}x+=v*dt;vy+=520*dt;y+=vy*dt;a+=av*dt;const target=ground(x)-25;if(y>=target){if(Math.abs(a)>1.65){stop('Car flipped!');return}if(air>.65){award(5);$('msg').textContent='Nice jump! +5 coins';chime()}air=0;y=target;vy=Math.min(0,v*slope(x))}fuel=Math.max(0,fuel-dt*(gas?2.5:.35)/(1+save.tank*.18));for(let i=Math.max(1,Math.floor(x/95)-2);i<=Math.floor(x/95)+2;i++){const px=i*95,py=ground(px)-45;if(!taken.has(i)&&Math.hypot(x-px,y-py)<52){taken.add(i);if(i%9===0){fuel=Math.min(100,fuel+45);$('msg').textContent='Fuel collected!'}else award(5);chime()}}if(x/10>=mission){award(25);$('msg').textContent='Mission complete! +25 coins';mission+=100;chime()}const d=Math.floor(x/10);if(d>save.best){save.best=d;if(d%10===0)persist()}for(const p of particles)p.t-=dt;particles=particles.filter(p=>p.t>0);if(!fuel)stop('Out of fuel!')}function poly(points,fill){g.fillStyle=fill;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function draw(){const cam=x-180,T=themes[track],sky=g.createLinearGradient(0,0,0,420);sky.addColorStop(0,T[0]);sky.addColorStop(1,T[1]);g.fillStyle=sky;g.fillRect(0,0,800,420);circle(660,70,36,'#fff3bb');for(let i=0;i<5;i++){let px=((i*215-cam*.09)%1000+1000)%1000-100;circle(px,65+i%2*28,20,'#ffffffaa');circle(px+26,60+i%2*28,26,'#ffffffaa');circle(px+52,70+i%2*28,17,'#ffffffaa')}for(let l=0;l<2;l++){const pts=[[0,420]];for(let p=0;p<=800;p+=10)pts.push([p,190+l*35+55*Math.sin((p+cam*(.14+l*.16))/130)+20*Math.sin((p+cam*.2)/45)]);pts.push([800,420]);poly(pts,T[2+l])}for(let i=Math.floor(cam/130);i*130<cam+800;i++){const px=i*130-cam,py=ground(i*130)-4;if(track===1){g.fillStyle='#66834c';g.fillRect(px-4,py-36,8,36);g.fillRect(px-13,py-25,24,7)}else{g.fillStyle='#72563d';g.fillRect(px-3,py-28,6,28);poly([[px-20,py-18],[px,py-65],[px+20,py-18]],track===2?'#416c83':'#26734c')}}const pts=[[0,420]];for(let p=0;p<=800;p+=4)pts.push([p,ground(p+cam)]);pts.push([800,420]);poly(pts,T[5]);g.strokeStyle=T[4];g.lineWidth=12;g.beginPath();for(let p=0;p<=800;p+=4){const yy=ground(p+cam);p?g.lineTo(p,yy):g.moveTo(p,yy)}g.stroke();for(let i=Math.max(1,Math.floor(cam/95));i*95<cam+800;i++){if(taken.has(i))continue;const px=i*95-cam,py=ground(i*95)-45;if(i%9===0){g.fillStyle='#d83939';g.fillRect(px-13,py-16,26,30);g.fillStyle='#fff';g.font='bold 17px system-ui';g.fillText('F',px-5,py+6)}else{circle(px,py,13,'#a76b12');circle(px,py,10,'#ffda55');g.fillStyle='#ad7417';g.font='bold 15px system-ui';g.fillText('★',px-7,py+5)}}for(const p of particles)circle(p.x-cam,p.y-(.5-p.t)*20,5+p.t*8,'#d7c1a577');g.save();g.translate(180,y);g.rotate(a);g.shadowColor='#0005';g.shadowBlur=8;poly([[-43,8],[-43,-10],[-26,-16],[-12,-35],[18,-35],[34,-14],[45,-9],[45,8]],colors[save.paint]);g.shadowBlur=0;const gloss=g.createLinearGradient(0,-35,0,10);gloss.addColorStop(0,'#ffffff65');gloss.addColorStop(.5,'#ffffff00');gloss.addColorStop(1,'#00000065');poly([[-43,8],[-43,-10],[-26,-16],[-12,-35],[18,-35],[34,-14],[45,-9],[45,8]],gloss);g.strokeStyle='#192a3d';g.lineWidth=1.5;g.beginPath();g.moveTo(7,-15);g.lineTo(7,5);g.moveTo(-24,-12);g.lineTo(-24,3);g.stroke();g.fillStyle='#e2e8ef';g.fillRect(10,-12,7,2);g.fillRect(-19,-12,7,2);g.fillStyle='#29394b';g.fillRect(-42,-12,5,9);g.fillRect(38,-3,9,4);poly([[-21,-17],[-9,-30],[4,-30],[4,-17]],'#bfe9ff');poly([[9,-30],[16,-30],[29,-17],[9,-17]],'#bfe9ff');g.fillStyle='#26364c';g.fillRect(-44,4,89,6);g.fillStyle='#fff5b5';g.fillRect(36,-7,9,7);for(const w of [-28,28]){circle(w,12,15,'#182331');g.strokeStyle='#56616c';g.lineWidth=2;g.beginPath();g.arc(w,12,13.5,0,Math.PI*2);g.stroke();circle(w,12,10,'#53667b');g.save();g.translate(w,12);g.rotate(x/15);g.strokeStyle='#c9d5df';g.lineWidth=3;for(let j=0;j<3;j++){g.rotate(Math.PI/3);g.beginPath();g.moveTo(-8,0);g.lineTo(8,0);g.stroke()}g.restore();circle(w,12,4,'#dce4ed')}g.restore();$('dist').textContent=Math.floor(x/10)+' m';$('coins').textContent=coins;$('fuel').textContent=Math.ceil(fuel)+'%';$('fill').style.width=fuel+'%';$('best').textContent=save.best+' m';$('mission').textContent=mission+' m';if(gain&&ctx){gain.gain.setTargetAtTime(sound&&running&&!paused&&!document.hidden?(gas?.045:.012):0,ctx.currentTime,.05);osc.frequency.setTargetAtTime(45+v*.35,ctx.currentTime,.05)}}let last=0;y=ground(0)-25;a=Math.atan(slope(0));garage();function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('pagehide',persist);
</script></body></html>
