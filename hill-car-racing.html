<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hill Car Racing 🐎</title><style>*{box-sizing:border-box}body{margin:0;background:#10243c;color:white;font:16px system-ui;touch-action:none}header{padding:12px;display:flex;justify-content:space-between;align-items:center}a{color:white}canvas{width:100%;height: min(58vh,420px);display:block;background:#a9e4ff}#hud{display:flex;justify-content:space-around;padding:10px}.controls{display:flex;gap:12px;padding:12px}button{flex:1;border:0;border-radius:14px;background:#ea9d25;color:#15253c;padding:22px;font:bold 20px system-ui;touch-action:none}#gas{background:#49d58b}#restart{padding:10px;font-size:15px}#msg{text-align:center;min-height:24px}small{display:block;text-align:center}</style><header><a href="./index.html">← MY WORLD</a><b>Hill Car Racing 🐎</b><button id="restart" style="flex:none">Restart</button></header><div id="hud"><span id="dist">0 m</span><span id="coins">🪙 0</span><span id="fuel">⛽ 100%</span><span id="best">Best 0</span></div><canvas id="c" width="800" height="420"></canvas><p id="msg">Hold GAS to climb hills!</p><div class="controls"><button id="brake">BRAKE</button><button id="gas">GAS</button></div><small>Keyboard: ← Brake / → Gas • Collect coins and fuel</small><script>const c=document.getElementById('c'),g=c.getContext('2d'),$=id=>document.getElementById(id);let x,v,y,vy,a,av,fuel,coins,over,gas=false,brake=false,taken=new Set(),best=0;try{best=Number(localStorage.getItem('mw-hill-best')||0)}catch{}const ground=x=>300+45*Math.sin(x/105)+28*Math.sin(x/58)+17*Math.sin(x/29);function reset(){x=0;v=0;y=ground(0)-25;vy=0;a=0;av=0;fuel=100;coins=0;over=false;taken.clear();gas=brake=false;$('msg').textContent='Hold GAS to climb hills!'}reset();function bind(id,set){const b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>set(false)}bind('gas',v=>gas=v);bind('brake',v=>brake=v);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();if(e.key==='ArrowRight')gas=true;else brake=true}});addEventListener('keyup',e=>{if(e.key==='ArrowRight')gas=false;if(e.key==='ArrowLeft')brake=false});addEventListener('blur',()=>gas=brake=false);$('restart').onclick=reset;function stop(msg){over=true;best=Math.max(best,Math.floor(x/10));try{localStorage.setItem('mw-hill-best',best)}catch{}$('msg').textContent=msg+' • Tap Restart'}function step(dt){if(over)return;const slope=(ground(x+20)-ground(x-20))/40;const touching=y>=ground(x)-26;if(touching){v+=(gas?150:0)*dt+(brake?-220:0)*dt+slope*130*dt;v*=Math.pow(.96,dt*60);if(brake&&v<0)v=0;v=Math.max(0,Math.min(270,v));av+=(Math.atan(slope)-a)*28*dt;av*=Math.pow(.85,dt*60)}else{av+=(gas?1.9:0)*dt-(brake?2.5:0)*dt}x+=v*dt;vy+=440*dt;y+=vy*dt;const target=ground(x)-25;if(y>=target){if(Math.abs(a)>1.65){stop('Car flipped!');return}y=target;vy=Math.min(0,v*slope)}a+=av*dt;fuel=Math.max(0,fuel-dt*(gas?2.4:.65));for(let i=Math.max(1,Math.floor(x/150)-1);i<=Math.floor(x/150)+1;i++){const px=i*150,py=ground(px)-48;if(!taken.has(i)&&Math.hypot(x-px,y-py)<43){taken.add(i);if(i%5===0)fuel=Math.min(100,fuel+35);else coins+=10}}if(!fuel)stop('Out of fuel!')}function draw(){const cam=x-180;g.fillStyle='#a9e4ff';g.fillRect(0,0,800,420);g.fillStyle='#ffe37a';g.beginPath();g.arc(670,65,35,0,7);g.fill();for(let layer=0;layer<2;layer++){g.fillStyle=layer?'#83bb86':'#b0d4b9';g.beginPath();g.moveTo(0,420);for(let px=0;px<=800;px+=10)g.lineTo(px,210+layer*30+50*Math.sin((px+cam*(.18+layer*.12))/145));g.lineTo(800,420);g.fill()}g.fillStyle='#94643c';g.beginPath();g.moveTo(0,420);for(let px=0;px<=800;px+=4)g.lineTo(px,ground(px+cam));g.lineTo(800,420);g.fill();g.strokeStyle='#4f9b43';g.lineWidth=9;g.beginPath();for(let px=0;px<=800;px+=4){const yy=ground(px+cam);if(!px)g.moveTo(px,yy);else g.lineTo(px,yy)}g.stroke();for(let i=Math.max(1,Math.floor(cam/150));i*150<cam+800;i++){if(taken.has(i))continue;const px=i*150-cam,py=ground(i*150)-48;g.fillStyle=i%5===0?'#d83240':'#ffcc35';g.beginPath();if(i%5===0){g.fillRect(px-12,py-15,24,29);g.fillStyle='white';g.font='bold 16px sans-serif';g.fillText('F',px-5,py+6)}else{g.arc(px,py,11,0,7);g.fill();g.strokeStyle='#a96d09';g.lineWidth=2;g.stroke()}}g.save();g.translate(180,y);g.rotate(a);g.fillStyle='#e83c47';g.fillRect(-35,-13,70,23);g.fillStyle='#324f70';g.fillRect(-13,-30,34,20);for(const w of [-24,24]){g.fillStyle='#202833';g.beginPath();g.arc(w,12,13,0,7);g.fill();g.fillStyle='#b3bfce';g.beginPath();g.arc(w,12,5,0,7);g.fill();g.strokeStyle='#ddd';g.beginPath();g.moveTo(w,12);g.lineTo(w+10*Math.cos(x/13),12+10*Math.sin(x/13));g.stroke()}g.restore();$('dist').textContent=Math.floor(x/10)+' m';$('coins').textContent='🪙 '+coins;$('fuel').textContent='⛽ '+Math.ceil(fuel)+'%';$('best').textContent='Best '+best+' m'}let last=0;function loop(t){const dt=Math.min(.035,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></html>
