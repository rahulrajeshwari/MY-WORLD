<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD | Office Login</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f9;font:16px system-ui;color:#142b4c}main{max-width:440px;margin:30px auto;padding:16px}section{background:white;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px #10264b20}header{background:linear-gradient(135deg,#101e38,#234776);color:white;padding:32px}header small,strong{color:#e8c477}h1{margin:12px 0}form{padding:24px}label{display:block;margin:16px 0 6px}input,button{width:100%;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #b8c9df}button{background:#142e55;color:white;border:0;margin-top:20px;font-weight:700}p{line-height:1.5}a{color:#234776}#status{color:#a51e30;font-size:14px}.brands{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 24px}.brands span{padding:8px;border:1px solid #dce6f5;border-radius:10px;font-weight:bold}</style><main><p><a href="./">← MY WORLD</a></p><section><header><small>AUTHORIZED ACCESS</small><h1>MY WORLD</h1><strong>OFFICE LOGIN</strong><p>One Platform. Powerful Business.</p></header><form id="login"><label for="uid">Office ID</label><input id="uid" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><button>VERIFY &amp; LOGIN</button><p id="status" role="status"></p><small>Authorized Office Staff Only</small></form><div class="brands"><span>Jio</span><span>Airtel</span><span>Vi</span><span>BSNL</span></div></section></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();document.getElementById('status').textContent='Office verification is not configured. Please contact the administrator.';document.getElementById('pw').value='';});</script></html>
