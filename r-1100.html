<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R-1100 | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf2;font:15px system-ui;text-align:center;color:#253248}header{padding:12px}a{color:#174a94}.phone{margin:10px auto 24px;width:min(310px,94vw);background:linear-gradient(90deg,#26394c,#647c91 12%,#aab4bd 50%,#647c91 88%,#26394c);border:5px solid #283747;border-radius:65px 65px 48px 48px;padding:24px 22px 30px;box-shadow:0 12px 25px #0004}.speaker{width:65px;height:8px;background:#25313b;border-radius:8px;margin:auto}.brand{font-weight:900;letter-spacing:3px;margin:12px;color:#172638}.screen{background:#a9b979;border:9px solid #35424a;border-radius:15px;color:#263b20;height:190px;padding:8px;font: bold 15px monospace;display:flex;flex-direction:column;text-align:left;overflow:hidden}.screen.off{background:#596448}.bar{display:flex;justify-content:space-between;font-size:12px}.display{flex:1;display:flex;flex-direction:column;justify-content:center;white-space:pre-wrap;overflow:auto;overflow-wrap:anywhere}.soft{display:flex;justify-content:space-between;font-size:12px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}button{touch-action:manipulation;cursor:pointer;background:linear-gradient(#f2f4f5,#9daab5);border:1px solid #53616c;border-radius:13px 13px 20px 20px;min-height:43px;color:#192b3d;font:bold 20px system-ui;box-shadow:0 3px #354450}button:active{transform:translateY(2px);box-shadow:0 1px #354450}button small{display:block;font:10px system-ui;letter-spacing:2px}.nav{font-size:14px}.power{color:#a51f2b}canvas{width:100%;height:110px;image-rendering:pixelated}footer{font-size:12px;padding:10px}.phone{width:min(292px,94vw);padding:23px 24px 32px;border:7px solid #263745;border-radius:55px 55px 48px 48px;background:linear-gradient(90deg,#344b60 0%,#344b60 9%,#c7c9c8 10%,#e1e2df 50%,#c7c9c8 90%,#344b60 91%);box-shadow:inset 0 0 9px #2228,0 16px 25px #0004}.screen{height:155px;border:8px solid #35434d;border-radius:8px;background:#b6c88b;box-shadow:inset 0 2px 9px #43552b55;font-size:13px}.keys{gap:7px}button{background:linear-gradient(#536674,#283b4c);color:#fff;border-radius:45% 45% 35% 35%;min-height:39px;font-size:18px;border:1px solid #253442;box-shadow:0 3px 1px #172734}button.nav{background:linear-gradient(#e3e4e1,#8e9da7);color:#182c3e;font-size:12px}.brand{font-size:17px}.display{line-height:1.15}.bar[hidden],.soft[hidden]{display:none}.soft{border-top:1px solid #52613c;padding-top:3px}header h2{margin:4px}footer{color:#526581}</style><header><a href="./game.html">← MY WORLD</a><h2>R-1100</h2>Old Memories, New Experience</header><div class="phone"><div class="speaker"></div><div class="brand">R-1100</div><div class="screen" id="screen"><div class="bar" id="bar"><span>▂▄▆█</span><span id="clock"></span><span>▰</span></div><div class="display" id="display"></div><div class="soft" id="soft"><span id="left">Menu</span><span id="right">Contacts</span></div></div><div class="keys" id="keys"><button class="nav" data-k="ok">Menu / OK</button><button class="nav" data-k="up">▲</button><button class="nav" data-k="back">Back / C</button><button class="nav" data-k="call">☎</button><button class="nav" data-k="down">▼</button><button class="nav power" data-k="power">⏻</button></div></div><footer>Independent retro simulator • Not affiliated with Nokia<br>MY WORLD • Founded by Mr. Rahul Kumawat</footer><script>
const $=id=>document.getElementById(id),keys=$('keys'),display=$('display');for(const [k,t] of [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*','+'],['0','SPACE'],['#','']]){const b=document.createElement('button');b.dataset.k=k;b.textContent=k;const s=document.createElement('small');s.textContent=t;b.append(s);keys.append(b)}
let mode='boot',on=true,idx=0,ringIndex=0,stopwatch=0,started=0,countEnd=0,reminder='',reminderFired=false,torch=false,dial='',msg='',last='',lastAt=0,cycle=0,expr='',audio,contacts=[],timer=null,snake=[],dir=[1,0],next=[1,0],food=[9,5],score=0,alarm='',alarmFired='',sound=true;try{contacts=JSON.parse(localStorage.getItem('r1100-contacts')||'[]')}catch{}const menu=['✉ Messages','▤ Contacts','▦ Snake','▧ Calculator','◷ Clock / Alarm','♪ Ringtone','⚙ Settings','▤ Call register','▣ Reminders','◴ Stopwatch','◷ Countdown','☀ Flashlight'];const groups={'1':'1.,!?','2':'ABC2','3':'DEF3','4':'GHI4','5':'JKL5','6':'MNO6','7':'PQRS7','8':'TUV8','9':'WXYZ9','0':' 0','*':'*+','#':'#'};function beep(f=1050,d=.045){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}const melodies=[[880,660,880,990,660,550,660,880],[523,659,784,1047,784,659],[740,740,988,740,554,740],[440,660,440,660,880,660]];function tune(notes,gap=145){notes.forEach((f,i)=>setTimeout(()=>beep(f,gap/1000*.82),i*gap))}function ring(){tune(melodies[ringIndex],180)}let calls=[];try{calls=JSON.parse(localStorage.getItem('r1100-calls')||'[]')}catch{}function time(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}function stop(){clearInterval(timer);timer=null}function go(m){stop();mode=m;idx=0;draw()}function draw(){ $('screen').classList.toggle('off',!on);$('bar').hidden=!on;$('soft').hidden=!on;$('clock').textContent=time();display.replaceChildren();if(!on)return;$('left').textContent='OK';$('right').textContent='Back';let t='';if(mode==='boot'){t='\n    R-1100\n\n   MY WORLD';$('left').textContent='';$('right').textContent=''}else if(mode==='home'){t='     MY WORLD\n\n      '+time()+'\n\n'+(dial||'   R-1100');$('left').textContent='Menu';$('right').textContent='Contacts'}else if(mode==='menu')t=String(idx+1)+' / '+menu.length+'\n\n     '+menu[idx]+'\n\n   ▲       ▼';else if(mode==='sms')t='Write message\n'+msg+'▏\n\nOK: Send via SMS';else if(mode==='contacts')t='Phonebook\n'+['+ Add contact',...contacts.map(c=>c.name+' '+c.phone)].map((x,i)=>(idx===i?'▶ ':'  ')+x).join('\n');else if(mode==='calc')t='Calculator\n\n'+(expr||'0')+'\n* operator • # =';else if(mode==='clock')t=time()+'\n'+new Date().toLocaleDateString()+'\nAlarm: '+(alarm||'Off')+'\nOK: Set alarm';else if(mode==='ring')t='Tones '+(ringIndex+1)+' / '+melodies.length+'\n\n▲▼ Select tone\nOK: Play ringtone';else if(mode==='settings')t='Keypad sound: '+(sound?'ON':'OFF')+'\nOK: Toggle';else if(mode==='calls')t='Dialled numbers\n'+(calls.slice(0,5).join('\n')||'No records');else if(mode==='reminder')t='Reminder\n'+(reminder||'Not set')+'\nOK: Set';else if(mode==='watch')t='Stopwatch\n\n'+((stopwatch+(started?Date.now()-started:0))/1000).toFixed(1)+' sec\nOK Start / Stop\n# Reset';else if(mode==='count')t='Countdown\n\n'+Math.ceil(Math.max(0,countEnd-Date.now())/1000)+' sec\nOK: Set timer';else if(mode==='torch')t='Screen light\n'+(torch?'ON':'OFF')+'\nOK: Toggle';else if(mode==='over')t='GAME OVER\nScore: '+score+'\nOK: Restart';else if(mode==='snake'){const c=document.createElement('canvas');c.width=200;c.height=110;display.append(c);const g=c.getContext('2d');g.fillStyle='#263b20';snake.forEach(([x,y])=>g.fillRect(x*10,y*10,9,9));g.fillRect(food[0]*10+2,food[1]*10+2,6,6);$('left').textContent='Score '+score;$('right').textContent='Exit';return}display.textContent=t}
function start(){stop();mode='snake';snake=[[5,5],[4,5],[3,5]];dir=next=[1,0];food=[9,5];score=0;draw();timer=setInterval(()=>{dir=next;const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]],eat=h[0]===food[0]&&h[1]===food[1];if(h[0]<0||h[0]>=20||h[1]<0||h[1]>=11||snake.slice(0,eat?snake.length:-1).some(p=>p[0]===h[0]&&p[1]===h[1])){go('over');return}snake.unshift(h);if(eat){score++;const free=[];for(let y=0;y<11;y++)for(let x=0;x<20;x++)if(!snake.some(p=>p[0]===x&&p[1]===y))free.push([x,y]);if(!free.length){go('over');return}food=free[Math.floor(Math.random()*free.length)]}else snake.pop();draw()},190)}
function call(n){if(/^\+?[0-9]{3,15}$/.test(n)){calls.unshift(n);calls=calls.slice(0,30);try{localStorage.setItem('r1100-calls',JSON.stringify(calls))}catch{}location.href='tel:'+n;}else alert('Enter a valid phone number')}
function press(k){beep();if(k==='power'){on=!on;stop();torch=false;document.body.style.background='';if(!on)tune([988,740,494,330],120);mode=on?'boot':'home';dial='';draw();if(on){tune([392,523,659,784],125);setTimeout(()=>{if(on&&mode==='boot'){mode='home';draw()}},1300)}return}if(!on||mode==='boot')return;if(mode==='snake'){if(k==='back'){go('menu');return}const d={'2':[0,-1],up:[0,-1],'8':[0,1],down:[0,1],'4':[-1,0],'6':[1,0]}[k];if(d&&!(d[0]===-dir[0]&&d[1]===-dir[1]))next=d;return}if(k==='back'){if(mode==='home'){if(dial)dial=dial.slice(0,-1);else go('contacts')}else if(mode==='sms'&&msg){msg=msg.slice(0,-1);last=''}else go('home');draw();return}if(mode==='home'){if(k==='ok')go('menu');else if(k==='call')call(dial);else if(/^[0-9]$/.test(k))dial=(dial+k).slice(0,15);else if(k==='*'&&!dial)dial='+'}else if(mode==='menu'){if(k==='up'||k==='down')idx=(idx+(k==='up'?-1:1)+menu.length)%menu.length;else if(k==='ok'){if(idx===2)start();else go(['sms','contacts','','calc','clock','ring','settings','calls','reminder','watch','count','torch'][idx])}}else if(mode==='contacts'){if(k==='up'||k==='down')idx=(idx+(k==='up'?-1:1)+contacts.length+1)%(contacts.length+1);else if(k==='ok'&&idx===0){const name=prompt('Contact name'),phone=name&&prompt('Phone number');if(name&&phone&&/^\+?[0-9]{3,15}$/.test(phone)){contacts.push({name,phone});try{localStorage.setItem('r1100-contacts',JSON.stringify(contacts))}catch{alert('Contact saved for this session only')}}}else if((k==='call'||k==='ok')&&idx>0)call(contacts[idx-1].phone)}else if(mode==='sms'){if(k==='ok'){const n=prompt('Recipient phone number');if(n&&/^\+?[0-9]{3,15}$/.test(n))location.href='sms:'+n+'?body='+encodeURIComponent(msg)}else if(groups[k]){const now=Date.now();if(last===k&&now-lastAt<850&&msg){cycle=(cycle+1)%groups[k].length;msg=msg.slice(0,-1)+groups[k][cycle]}else{cycle=0;msg+=groups[k][0]}last=k;lastAt=now;msg=msg.slice(0,500)}}else if(mode==='calc'){if(/^[0-9]$/.test(k))expr=(expr+k).slice(0,40);else if(k==='*'){const op=prompt('Operator: + - * /');if(['+','-','*','/'].includes(op))expr+=op}else if(k==='#'||k==='ok'){const m=expr.match(/^(\d+(?:\.\d+)?)([+*/-])(\d+(?:\.\d+)?)$/);if(m){const a=Number(m[1]),b=Number(m[3]);expr=String(({'+':()=>a+b,'-':()=>a-b,'*':()=>a*b,'/':()=>a/b}[m[2]])());if(!Number.isFinite(Number(expr)))expr='Error'}else expr=''}}else if(mode==='clock'&&k==='ok'){const a=prompt('Alarm HH:MM (24 hour), blank to disable',alarm);if(a!==null&&(a===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(a))){alarm=a;alarmFired=''}}else if(mode==='ring'){if(k==='ok')ring();else if(k==='up'||k==='down'){ringIndex=(ringIndex+(k==='up'?-1:1)+melodies.length)%melodies.length;ring()}}else if(mode==='reminder'&&k==='ok'){const s=prompt('Reminder time HH:MM',reminder);if(s!==null&&(s===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(s))){reminder=s;reminderFired=false}}else if(mode==='watch'){if(k==='ok'){if(started){stopwatch+=Date.now()-started;started=0}else started=Date.now()}else if(k==='#'){stopwatch=0;started=0}}else if(mode==='count'&&k==='ok'){const n=Number(prompt('Countdown seconds (1–3600)'));if(Number.isInteger(n)&&n>0&&n<=3600)countEnd=Date.now()+n*1000}else if(mode==='torch'&&k==='ok'){torch=!torch;document.body.style.background=torch?'white':''}else if(mode==='settings'&&k==='ok')sound=!sound;else if(mode==='over'&&k==='ok')start();draw()}
keys.addEventListener('click',e=>{const b=e.target.closest('button');if(b)press(b.dataset.k)});setInterval(()=>{const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(alarm===t&&alarmFired!==n.toDateString()+t){alarmFired=n.toDateString()+t;ring();alert('R-1100 Alarm')}if(on&&countEnd&&Date.now()>=countEnd){countEnd=0;ring();alert('Countdown finished')}if(on&&reminder===t&&!reminderFired){reminderFired=true;ring();alert('R-1100 Reminder')}if(mode!=='snake')draw()},1000);draw();setTimeout(()=>{if(on&&mode==='boot'){mode='home';draw()}},1300);
