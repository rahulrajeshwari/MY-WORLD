<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Customer Khata | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#17345f;font:15px system-ui}header{background:#174ba5;color:white;padding:20px}header a{color:white}main{max-width:650px;margin:auto;padding:16px}section{background:white;padding:20px;border-radius:16px;margin-bottom:14px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #ccd9eb;border-radius:8px;font:inherit}button{background:#1758bd;color:white;border:0;border-radius:9px;padding:12px;margin:5px 0;cursor:pointer}article{border-top:1px solid #dce5f3;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}#output{display:none}@media print{header,main{display:none}#output{display:block;white-space:pre-wrap;padding:25px}}</style><header><a href="./index.html">← MY WORLD</a><h1>Digital Customer Khata</h1></header><main><section><form id="f"><label>Customer Name<input name="0"  required></label><label>Mobile Number<input name="1" type="tel" ></label><label>Transaction Type (Credit / Payment)<select name="2"><option>Credit</option><option>Payment</option></select></label><label>Amount<input name="3" type="number" min="0" step="0.01" required></label><label>Date<input name="4" type="date" ></label><label>Notes<input name="5"  ></label><button>Save Record</button></form><p id="status"></p><small>रिकॉर्ड केवल इस डिवाइस में सेव होंगे।</small></section><section id="records" ><h2>Saved Records</h2><div id="list"></div></section></main><div id="output"></div><script>const fields=["Customer Name","Mobile Number","Transaction Type (Credit / Payment)","Amount","Date","Notes"],mode="khata",key="mw-customer-khata",f=document.getElementById('f'),list=document.getElementById('list');let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch{}function render(){list.replaceChildren();if(mode==='khata'){const sums=new Map();for(const r of rows){const k=r[0]+' '+r[1];sums.set(k,(sums.get(k)||0)+(r[2]==='Credit'?1:-1)*Number(r[3]))}for(const [k,v] of sums){const p=document.createElement('p');p.textContent=k+' — Balance ₹'+v.toFixed(2);list.append(p)}}rows.forEach((r,i)=>{const a=document.createElement('article');a.textContent=fields.map((x,j)=>x+': '+r[j]).join('\n');const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>{if(confirm('Delete record?')){rows.splice(i,1);localStorage.setItem(key,JSON.stringify(rows));render()}};a.append(document.createElement('br'),b);list.append(a)})}f.onsubmit=e=>{e.preventDefault();const r=fields.map((_,i)=>f.elements.namedItem(String(i)).value.trim()),msg="Digital Customer Khata"+'\n'+fields.map((x,i)=>x+': '+r[i]).join('\n');if(mode==='wa'){location.href='https://wa.me/917572805685?text='+encodeURIComponent(msg)}else if(mode==='print'){document.getElementById('output').textContent=msg;window.print()}else{try{localStorage.setItem(key,JSON.stringify([r,...rows]));rows.unshift(r);render();f.reset();document.getElementById('status').textContent='Saved'}catch{document.getElementById('status').textContent='Save failed'}}};render()</script></html>
