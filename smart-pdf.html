<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart PDF Maker</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#17345f;font:15px system-ui}header{padding:20px;background:#174ba5;color:white}header a{color:white}main{max-width:600px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:20px}label{display:block;margin:14px 0}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:12px;border:1px solid #ccd9eb;border-radius:8px;font:inherit;margin-top:6px}button{background:#1758bd;color:white;border:0;padding:14px;border-radius:10px;width:100%;font:inherit}small{color:#60738d}</style><header><a href="./index.html">← MY WORLD</a><h1>Smart PDF Maker</h1></header><main><section><form id="f"><label>PDF Type<select id="type"><option value="photo">Photos to PDF</option><option value="text">Text to PDF</option></select></label><label id="photos">Select Photos<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label id="words" hidden>Text<textarea id="txt" rows="8"></textarea></label><label>PDF File Name<input id="name" value="MY WORLD" required></label><label><input type="checkbox" id="lock"> Password Protect PDF</label><label id="pwbox" hidden>Password<input type="password" id="pw" autocomplete="new-password" maxlength="32"><small>Use a strong password (up to 32 ASCII characters).</small></label><button id="go">Create & Download PDF</button><p id="status" role="status"></p></form><small>Files are processed on your device. Password protection uses jsPDF legacy PDF encryption; not recommended for highly sensitive documents. Text mode supports Latin characters; other scripts can be added as photos.</small></section></main><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script>(()=>{const $=id=>document.getElementById(id);$('type').onchange=()=>{$('photos').hidden=$('type').value!=='photo';$('words').hidden=$('type').value!=='text'};$('lock').onchange=()=>{$('pwbox').hidden=!$('lock').checked;$('pw').required=$('lock').checked};$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;$('status').textContent='Creating PDF…';try{if(!window.jspdf)throw Error('PDF library unavailable. Connect to internet and refresh.');const options={unit:'mm',format:'a4'};if($('lock').checked){const p=$('pw').value;if(!/^[\x20-\x7e]{8,32}$/.test(p))throw Error('Use 8–32 English letters, numbers or symbols.');const random=crypto.getRandomValues(new Uint8Array(16));options.encryption={userPassword:p,ownerPassword:Array.from(random,x=>x.toString(16).padStart(2,'0')).join(''),userPermissions:['print','copy','modify','annot-forms']}}const doc=new window.jspdf.jsPDF(options);if($('type').value==='photo'){const files=[...$('files').files];if(!files.length)throw Error('Select at least one photo.');for(let i=0;i<files.length;i++){const bitmap=await createImageBitmap(files[i]);const c=document.createElement('canvas');const scale=Math.min(1,1800/Math.max(bitmap.width,bitmap.height));c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bitmap,0,0,c.width,c.height);bitmap.close();if(i)doc.addPage();const k=Math.min(190/c.width,277/c.height);doc.addImage(c.toDataURL('image/jpeg',.9),'JPEG',(210-c.width*k)/2,(297-c.height*k)/2,c.width*k,c.height*k)}}else{const t=$('txt').value.trim();if(!t)throw Error('Enter text.');if(/[^\x00-\x7f]/.test(t))throw Error('For Hindi or other scripts, use a photo of the text.');let y=15;for(const line of doc.splitTextToSize(t,180)){if(y>280){doc.addPage();y=15}doc.text(line,15,y);y+=7}}doc.save($('name').value.replace(/[\\/:*?"<>|]/g,'_').replace(/\.pdf$/i,'')+'.pdf');$('status').textContent='PDF ready.';$('pw').value=''}catch(err){$('status').textContent=err.message}finally{$('go').disabled=false}}})();</script></html>
