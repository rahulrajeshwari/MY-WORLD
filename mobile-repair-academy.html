if(!seen.includes(i))seen.push(i);try{localStorage.setItem('mw-repair-roadmap',JSON.stringify(seen))}catch{}render()};$('sound').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('title').textContent+' '+$('guide').textContent+' '+$('safe').textContent);u.lang=['en-IN','hi-IN','gu-IN'][l];speechSynthesis.speak(u)}};render();</script></html>
