<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY ARTS MEHANDI</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7f5;color:#633b48;font:15px system-ui}header{background:#833b59;color:white;padding:22px}header a{color:white}main{max-width:900px;margin:auto;padding:15px}nav{display:flex;gap:8px;overflow:auto;padding:12px 0}button{border:1px solid #e7c6d0;border-radius:20px;background:white;color:#833b59;padding:10px;white-space:nowrap}button.active{background:#833b59;color:white}#feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}article{background:white;border-radius:14px;overflow:hidden;border:1px solid #f1dbe1}article img{width:100%;height:210px;object-fit:cover;background:#f5e6e9}article div{padding:10px}a{color:#833b59}small{display:block;margin-top:8px;overflow-wrap:anywhere}#status{padding:10px}</style><header><a href="./index.html">← MY WORLD</a><h1>MY ARTS MEHANDI</h1>Discover beautiful henna designs</header><main><nav id="tabs"></nav><p id="status" role="status"></p><div id="feed"></div><button id="more" hidden>Load More Designs</button><p><small>Photos from Wikimedia Commons. Tap the source link for creator and license details. Internet required.</small></p></main><script>const cats=[['All Designs','mehndi hands henna'],['Arabic','Arabic mehndi hand'],['Bridal','bridal mehndi hands'],['Simple','simple henna hand'],['Front Hand','henna palm hand'],['Back Hand','henna back of hand'],['Finger','henna fingers'],['Rajasthani','Rajasthani mehndi hands'],['Festival','festival mehndi hands']];const $=id=>document.getElementById(id);let current=0,offset=0,token=0,seen=new Set();cats.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>select(i);$('tabs').append(b)});function select(i){current=i;offset=0;seen.clear();$('feed').replaceChildren();[...$('tabs').children].forEach((b,j)=>b.classList.toggle('active',i===j));load()}async function load(){const t=++token;$('more').hidden=true;$('status').textContent='Loading designs…';try{const p=new URLSearchParams({action:'query',generator:'search',gsrsearch:cats[current][1]+' filetype:bitmap',gsrnamespace:'6',gsrlimit:'24',gsroffset:String(offset),prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'500',format:'json',origin:'*'});const r=await fetch('https://commons.wikimedia.org/w/api.php?'+p);if(!r.ok)throw Error();const data=await r.json();if(t!==token)return;const pages=Object.values(data.query?.pages||{}).sort((a,b)=>a.index-b.index);for(const page of pages){const info=page.imageinfo?.[0];if(!info?.thumburl||seen.has(page.pageid)||!info.mime?.startsWith('image/'))continue;seen.add(page.pageid);const card=document.createElement('article'),img=document.createElement('img');img.src=info.thumburl;img.loading='lazy';img.alt=page.title.replace(/^File:/,'');img.onerror=()=>card.remove();const d=document.createElement('div'),title=document.createElement('b');title.textContent=cats[current][0]+' • '+seen.size;const a=document.createElement('a');a.href=info.descriptionurl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View photo & credit';const small=document.createElement('small');small.append(a);d.append(title,small);card.append(img,d);$('feed').append(card)}offset=data.continue?.gsroffset||0;$('more').hidden=!offset;$('status').textContent=seen.size?seen.size+' designs loaded':'No matching photos. Try another category.'}catch{if(t===token)$('status').textContent='Photos could not load. Check internet and select category again.'}}$('more').onclick=load;select(0)</script></html>
