<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6545cf"><title>Rahul Ho Gaya Confuse | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#f6f4ff;color:#282044}header{background:linear-gradient(120deg,#5432bc,#ec5796);color:white;padding:24px 17px 33px}header a{color:white;text-decoration:none;font-size:13px}header h1{margin:17px 0 6px;font-size:27px}header p{font-size:13px;line-height:1.6;color:#fff2ff}main{max-width:650px;margin:25px auto;padding:0 15px 55px}.game{background:#fff;border-radius:23px;padding:24px;box-shadow:0 12px 30px #422d8616;border:1px solid #e7e1fb}.top{display:flex;justify-content:space-between;gap:10px;color:#65578e;font-size:13px;font-weight:750}.track{height:9px;border-radius:20px;background:#ece6fc;margin:15px 0 26px;overflow:hidden}.bar{height:100%;width:0;background:#8053df;transition:width .2s}.question{font-size:21px;line-height:1.65;font-weight:800;margin:0 0 22px}.answers{display:grid;gap:11px}.answer{background:#f5f2ff;border:2px solid #e3dafb;border-radius:14px;padding:14px 16px;text-align:left;font:inherit;font-weight:700;cursor:pointer;color:#302452}.answer:disabled{cursor:default}.answer.correct{border-color:#29966c;background:#e9fff5;color:#166344}.answer.wrong{border-color:#d95468;background:#fff0f2;color:#a72f47}.feedback{min-height:54px;margin:16px 0 7px;font-size:14px;line-height:1.6;color:#5b507b}.next,.restart{width:100%;background:#6342cc;color:white;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:800;cursor:pointer}.next:disabled{opacity:.5;cursor:default}.result{text-align:center}.result h2{font-size:24px}.result .trophy{font-size:60px}.result p{line-height:1.7}.note{font-size:12px;color:#756d8d;text-align:center;margin-top:18px}footer{text-align:center;color:#9389aa;font-size:12px;padding:22px}@media(max-width:450px){.game{padding:17px}.question{font-size:19px}header h1{font-size:24px}}</style></head><body><header><a href="./index.html">← MY WORLD Home</a><h1>🧩 Rahul Ho Gaya Confuse</h1><p>दिमाग घुमाने वाली पहेलियाँ • सही जवाब चुनो • Score बढ़ाओ!</p></header><main><section class="game" id="game"><div class="top"><span id="progress">सवाल 1 / 15</span><span id="score">⭐ Score: 0</span></div><div class="track"><div class="bar" id="bar"></div></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><button class="next" id="next" disabled>अगला सवाल →</button></section><p class="note">यह मनोरंजन और सीखने का गेम है। Score केवल इस गेम में दिखता है; RCoin या असली Rewards नहीं मिलते।</p></main><footer>MY WORLD • Rahul Ho Gaya Confuse</footer><script>const questions=[["ऐसी कौन-सी चीज़ है जो जितना सुखाती है, उतनी गीली होती जाती है?",["तौलिया","सूरज","पंखा","किताब"],0,"तौलिया पानी सोखता है।"],["किसके पास चाबियाँ हैं, लेकिन ताले नहीं खोल सकता?",["दरवाज़ा","पियानो","अलमारी","बक्सा"],1,"पियानो में संगीत की keys होती हैं।"],["ऐसी कौन-सी चीज़ है जो टूटती है लेकिन आवाज़ नहीं करती?",["काँच","खामोशी","लकड़ी","प्लेट"],1,"खामोशी टूट सकती है।"],["किस महीने में 28 दिन होते हैं?",["फरवरी","जनवरी","सभी महीने","जून"],2,"हर महीने में कम से कम 28 दिन होते हैं।"],["ऐसी कौन-सी चीज़ है जिसे बाँटने से बढ़ती है?",["चॉकलेट","ज्ञान","पैसा","रोटी"],1,"ज्ञान साझा करने से फैलता है।"],["वह क्या है जो ऊपर जाता है लेकिन नीचे नहीं आता?",["गुब्बारा","उम्र","पतंग","धुआँ"],1,"उम्र हमेशा बढ़ती है।"],["एक हाथ में पाँच उँगलियाँ हैं, दो हाथों में कितनी?",["5","8","10","12"],2,"दो हाथों में कुल दस उँगलियाँ।"],["कौन-सा फल नाम में रंग भी है?",["सेब","संतरा","केला","अमरूद"],1,"संतरा फल भी है और रंग भी।"],["ऐसा क्या है जो आपके पास है, पर दूसरे ज़्यादा इस्तेमाल करते हैं?",["नाम","जूते","मोबाइल","बैग"],0,"लोग आपको आपके नाम से पुकारते हैं।"],["किसे जितना खोदो, वह उतना बड़ा होता है?",["पहाड़","गड्ढा","पेड़","घर"],1,"खोदने से गड्ढा बड़ा होता है।"],["ऐसा क्या है जो चलता है पर पैर नहीं हैं?",["घड़ी","कुर्सी","मेज़","किताब"],0,"घड़ी चलती है।"],["कौन-सी चीज़ बिना पंख के उड़ती है?",["मछली","समय","पत्थर","कुर्सी"],1,"कहते हैं समय उड़ जाता है।"],["तीन सेब में से दो ले लिए, आपके पास कितने हैं?",["1","2","3","5"],1,"आपने दो सेब लिए हैं।"],["किस चीज़ का सिर और पूँछ होती है, पर शरीर नहीं?",["सिक्का","कुत्ता","बिल्ली","मछली"],0,"सिक्के के head और tail होते हैं।"],["कौन-सा सवाल है जिसका जवाब हर पल बदल सकता है?",["नाम क्या है?","समय क्या हुआ?","देश क्या है?","रंग क्या है?"],1,"समय लगातार बदलता है।"]];let index=0,score=0,selected=false;const $=id=>document.getElementById(id);function show(){selected=false;const q=questions[index];$('progress').textContent='सवाल '+(index+1)+' / '+questions.length;$('score').textContent='⭐ Score: '+score;$('bar').style.width=(index/questions.length*100)+'%';$('question').textContent=q[0];$('feedback').textContent='सही जवाब चुनिए 👇';$('answers').innerHTML='';q[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>choose(i));$('answers').appendChild(b)});$('next').disabled=true;$('next').textContent=index===questions.length-1?'Result देखें 🏆':'अगला सवाल →'}function choose(i){if(selected)return;selected=true;const q=questions[index],ok=i===q[2];if(ok)score+=10;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('score').textContent='⭐ Score: '+score;$('feedback').textContent=(ok?'🎉 सही जवाब! ':'😄 कोई बात नहीं! ')+' '+q[3];$('next').disabled=false}$('next').addEventListener('click',()=>{if(!selected)return;index++;if(index<questions.length)show();else result()});function result(){$('bar').style.width='100%';$('game').innerHTML='<div class="result"><div class="trophy">🏆</div><h2>गेम पूरा हुआ!</h2><p>आपका Score: <strong>'+score+' / '+(questions.length*10)+'</strong></p><p>'+(score>=120?'वाह! आप तो Puzzle Champion हैं! 😎':score>=70?'बहुत बढ़िया! फिर से खेलकर नया रिकॉर्ड बनाओ! 🎉':'मज़ा आया? एक बार और कोशिश करो! 😄')+'</p><button class="restart" id="restart">🔄 फिर से खेलें</button></div>';$('restart').addEventListener('click',()=>location.reload())}show()</script><script src="./game-sound.js" defer></script></body></html>
