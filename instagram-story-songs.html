<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1c39"><title>Instagram Story Songs | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fb;color:#182b4a;font-family:system-ui,Arial,sans-serif}header{background:#0d1b37;padding:17px;color:#fff}header div{max-width:820px;margin:auto;display:flex;justify-content:space-between}header a{color:#c5d7f0;text-decoration:none;font-size:13px}main{max-width:820px;margin:auto;padding:18px 12px}.hero{background:linear-gradient(120deg,#1b2e61,#7b3eb9,#d54b8c);border-radius:18px;padding:24px;color:#fff;margin-bottom:17px}.hero h1{font-size:25px;margin:0 0 5px}.hero p{font-size:13px;margin:0;color:#f2e7fc}.search{width:100%;padding:14px;border:1px solid #d4dfed;border-radius:12px;font:inherit;margin-bottom:12px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:13px}.tab{white-space:nowrap;border:1px solid #d8e1ee;border-radius:22px;background:white;padding:10px 13px;font:inherit;font-size:12px;font-weight:750;color:#344c72}.tab.active{background:#254fba;color:white}.songs{display:grid;gap:10px}.song{background:#fff;border:1px solid #dce4ef;border-radius:13px;padding:13px;display:flex;align-items:center;gap:10px}.song .note{font-size:22px;background:#eaf0ff;border-radius:11px;padding:10px}.song .info{flex:1;min-width:0}.song b{display:block;font-size:14px}.song small{font-size:11px;color:#7b8aa0}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.actions a{border:0;background:#e8effd;color:#234da4;border-radius:9px;padding:10px;text-decoration:none;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.actions a{background:#245ac9;color:white}.foot{color:#8190a7;font-size:11px;text-align:center;line-height:1.7;padding:22px}.empty{padding:20px;text-align:center;color:#7788a2}@media(max-width:430px){.song{flex-wrap:wrap}.actions{width:100%}.actions button,.actions a{flex:1;text-align:center}}</style></head><body><header><div><a href="./index.html">← MY WORLD</a><b>🎵 STORY SONGS</b></div></header><main><section class="hero"><h1>Instagram Story Songs 🎶</h1><p>60 Song Names • Search • Copy • Open Instagram</p></section><input class="search" id="search" placeholder="🔎 Song का नाम खोजें..." aria-label="Search songs"><div class="tabs" id="tabs"></div><div class="songs" id="songs"></div><p class="foot">गाने के नाम Copy करें, Instagram Story में Music Sticker खोलें और Search करें। Instagram पर गाने की उपलब्धता अकाउंट और क्षेत्र पर निर्भर करती है।</p></main><script>const data=[["❤️ Romantic","Heeriye|Kesariya|Chaleya|Raatan Lambiyan|Apna Bana Le|O Maahi|Satranga|Tere Vaaste|Tum Hi Ho|Shayad"],["😎 Attitude","Brown Munde|Excuses|Insane|Cheques|Still Rollin|We Rollin|Born to Shine|GOAT|Softly|Winning Speech"],["🌿 Travel","Ilahi|Safarnama|Phir Se Ud Chala|Khaabon Ke Parinday|Yun Hi Chala Chal|Patakha Guddi|Journey Song|Love You Zindagi|Aao Milo Chalo|Zinda"],["💔 Sad","Channa Mereya|Agar Tum Saath Ho|Hamari Adhuri Kahani|Tujhe Kitna Chahne Lage|Bekhayali|Mann Bharrya|Pachtaoge|Phir Bhi Tumko Chaahunga|Tera Yaar Hoon Main|Khairiyat"],["🙏 Devotional","Hanuman Chalisa|Shri Ram Janki Baithe Hain Mere Seene Mein|Ram Siya Ram|Mere Ghar Ram Aaye Hain|Achyutam Keshavam|Shiv Tandav Stotram|Namo Namo|Deva Shree Ganesha|O Palan Hare|Arziyan"],["🎉 Friendship","Gallan Goodiyaan|Badtameez Dil|London Thumakda|Kala Chashma|Abhi Toh Party Shuru Hui Hai|Tareefan|Kar Gayi Chull|Dil Dhadakne Do|Senorita|Yaaron"]].map(([cat,s])=>({cat,songs:s.split('|')}));const all=data.flatMap(x=>x.songs.map(s=>({name:s,cat:x.cat})));let category='All';const tabs=document.getElementById('tabs'),list=document.getElementById('songs'),search=document.getElementById('search');function render(){tabs.replaceChildren();['All',...data.map(x=>x.cat)].forEach(c=>{const b=document.createElement('button');b.className='tab'+(category===c?' active':'');b.textContent=c;b.onclick=()=>{category=c;render()};tabs.append(b)});list.replaceChildren();const items=all.filter(x=>(category==='All'||x.cat===category)&&x.name.toLowerCase().includes(search.value.trim().toLowerCase()));if(!items.length){list.innerHTML='<div class="empty">Song नहीं मिला</div>';return}for(const s of items){const el=document.createElement('div');el.className='song';const icon=document.createElement('span');icon.className='note';icon.textContent='🎵';const info=document.createElement('div');info.className='info';const name=document.createElement('b');name.textContent=s.name;const cat=document.createElement('small');cat.textContent=s.cat;info.append(name,cat);const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.textContent='📋 Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.name);copy.textContent='✓ Copied'}catch{const t=document.createElement('textarea');t.value=s.name;document.body.append(t);t.select();document.execCommand('copy');t.remove();copy.textContent='✓ Copied'}setTimeout(()=>copy.textContent='📋 Copy',1400)};const insta=document.createElement('a');insta.href='https://www.instagram.com/';insta.target='_blank';insta.rel='noopener noreferrer';insta.textContent='Instagram ↗';actions.append(copy,insta);el.append(icon,info,actions);list.append(el)}}search.addEventListener('input',render);render();</script></body></html>
