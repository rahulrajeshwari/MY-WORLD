<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#17345f;font:15px system-ui}header{background:#174ba5;color:white;padding:20px}header a{color:white}main{max-width:700px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:18px;margin-bottom:14px}label{display:block;margin:10px 0}input,select{width:100%;padding:10px;border:1px solid #ccd9eb;border-radius:8px;font:inherit}button{background:#1758bd;color:white;border:0;border-radius:9px;padding:12px;margin:5px;cursor:pointer}canvas{max-width:100%;height:auto;border:1px solid #ccd9eb}article{padding:10px;border-bottom:1px solid #ddd}small{color:#60738d}@media print{header,form,button,small{display:none}body,section{background:white}canvas{width:100mm;height:150mm;border:0}}</style><header><a href="./index.html">← MY WORLD</a><h1>Passport Photo Maker</h1></header><main><section><form><label>Upload Photo<input id="file" type="file" accept="image/*"></label><label>Photo Size<select id="size"><option value="35,45">35 × 45 mm</option><option value="51,51">51 × 51 mm</option><option value="25,35">25 × 35 mm</option></select></label><label>Zoom<input id="zoom" type="range" min="1" max="3" step=".05" value="1"></label><label>Horizontal position<input id="x" type="range" min="0" max="100" value="50"></label><label>Vertical position<input id="y" type="range" min="0" max="100" value="50"></label></form><canvas id="sheet" width="1181" height="1772"></canvas><button id="download" disabled>Download Print Sheet</button><button id="print" disabled>Print</button><small>100 × 150 mm sheet, approximately 300 DPI. Print at actual size. Background and official photo requirements must be checked separately.</small></section></main><script>const $=id=>document.getElementById(id),c=$('sheet'),ctx=c.getContext('2d');let img;function draw(){ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);if(!img)return;const [w,h]=$('size').value.split(',').map(v=>Math.round(v*11.81)),gap=35,cols=Math.floor((c.width-gap)/(w+gap)),rows=Math.floor((c.height-gap)/(h+gap)),scale=Math.max(w/img.width,h/img.height)*Number($('zoom').value),sw=w/scale,sh=h/scale,sx=(img.width-sw)*Number($('x').value)/100,sy=(img.height-sh)*Number($('y').value)/100;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=gap+i*(w+gap),y=gap+j*(h+gap);ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.strokeStyle='#aaa';ctx.strokeRect(x,y,w,h)}}$('file').onchange=async()=>{try{if(!$('file').files[0])return;const next=await createImageBitmap($('file').files[0]);if(img)img.close();img=next;draw();$('download').disabled=$('print').disabled=false}catch{alert('Photo could not be opened')}};for(const id of ['size','zoom','x','y'])$(id).oninput=draw;$('download').onclick=()=>{const a=document.createElement('a');a.download='passport-photo-sheet.png';a.href=c.toDataURL();a.click()};$('print').onclick=()=>window.print();draw();</script></html>
