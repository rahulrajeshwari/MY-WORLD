<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#091328"><title>Rahul Fruit Ninja X | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#071126;color:#f4f8ff;font-family:system-ui,Arial,sans-serif}header{max-width:650px;margin:auto;padding:15px;display:flex;justify-content:space-between;align-items:center}header a{color:#a9c2e7;text-decoration:none;font-size:13px}.brand{font-size:15px;font-weight:900;letter-spacing:1px}.brand b{color:#53e5d3}main{max-width:650px;margin:auto;padding:0 12px 22px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:7px 0 11px}.stat{background:#142443;border:1px solid #284368;border-radius:13px;padding:9px 11px}.stat small{font-size:10px;color:#9cb3d2;display:block;letter-spacing:1px}.stat strong{font-size:22px;font-variant-numeric:tabular-nums}.stage{position:relative;width:100%;max-width:440px;margin:auto;aspect-ratio:3/4;max-height:70vh;border:2px solid #34567f;border-radius:19px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#213d5e,#0b1b35 75%);box-shadow:0 15px 35px #0006;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:#071328df;display:grid;place-items:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.panel h1{font-size:29px;line-height:1.15;margin:8px 0;color:#65ebd3}.panel p{color:#b3c8e4;font-size:13px;line-height:1.7}.panel .fruit{font-size:42px}.primary{background:linear-gradient(120deg,#16b6aa,#237ce8);border:0;border-radius:13px;padding:14px 27px;color:white;font:inherit;font-weight:900;cursor:pointer;margin-top:10px}.footer{text-align:center;color:#91a8c8;font-size:12px;margin:14px auto}.tip{text-align:center;font-size:12px;color:#a8bfdc;margin-top:12px}@media(max-width:380px){.stage{max-height:65vh}.panel h1{font-size:25px}}</style><style id="mw-premium-v216">body{background:radial-gradient(ellipse at top,#203e60 0%,#101d32 45%,#080f1e 100%);min-height:100vh}header{border-bottom:1px solid #ffffff24;background:linear-gradient(110deg,#12233e,#25466a);color:#f5f8ff}header a{color:#c5ddff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #ffc857;outline-offset:3px}button:not(:disabled){transition:filter .15s,box-shadow .15s}button:not(:disabled):active{filter:brightness(.88)}.stage,.board,canvas:not(.phone canvas){box-shadow:0 12px 32px #0005}footer{color:#b6c9e5}</style></head><body><header><a href="./index.html">← MY WORLD</a><div class="brand">RAHUL <b>FRUIT NINJA X</b></div></header><main><div class="hud"><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>TIME</small><strong id="time">60</strong></div><div class="stat"><small>BEST</small><strong id="best">0</strong></div></div><div class="stage" id="stage"><canvas id="game" width="360" height="480" aria-label="Fruit slicing game"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="fruit">🍉 🍍 🍓</div><h1 id="heading">RAHUL<br>FRUIT NINJA X</h1><p id="message">Swipe across the fruits to slice them.<br>Avoid the bombs! You have 60 seconds.</p><button class="primary" id="start">START GAME ▶</button></div></div></div><div class="tip">👆 Swipe on mobile • Drag mouse on laptop • 💣 Avoid bombs</div><div class="footer">MY WORLD • Rahul Fruit Ninja X</div></main><script>(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=360,H=480,scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),startBtn=document.getElementById('start');const fruitTypes=[{emoji:'🍉',color:'#f36b79'},{emoji:'🍊',color:'#ffa542'},{emoji:'🍎',color:'#f05255'},{emoji:'🍋',color:'#f6d752'},{emoji:'🍍',color:'#eabf4d'},{emoji:'🥝',color:'#82d56d'},{emoji:'🍓',color:'#f04d79'}];let objects=[],particles=[],trails=[],score=0,best=0,time=60,elapsed=0,spawn=0,last=0,state='ready',pointer=false,previous=null;try{best=Number(localStorage.getItem('rahul-fruit-ninja-x-best'))||0}catch{}bestEl.textContent=best;function rand(a,b){return a+Math.random()*(b-a)}function start(){objects=[];particles=[];trails=[];score=0;time=60;elapsed=0;spawn=0;pointer=false;previous=null;spawnFruit();spawnFruit();scoreEl.textContent='0';timeEl.textContent='60';state='playing';overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}function end(bomb){if(state!=='playing')return;state='over';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('rahul-fruit-ninja-x-best',String(best))}catch{}}heading.textContent=bomb?'BOOM! GAME OVER':'TIME UP!';message.innerHTML='Your Score: <b>'+score+'</b><br>Best Score: <b>'+best+'</b>';startBtn.textContent='PLAY AGAIN ↻';overlay.hidden=false}function spawnFruit(){const count=Math.random()<.27?2:1;for(let i=0;i<count;i++){const bomb=Math.random()<.13;const type=fruitTypes[Math.floor(Math.random()*fruitTypes.length)];objects.push({x:rand(40,W-40),y:H+30,vx:rand(-55,55),vy:rand(-450,-360),r:bomb?22:25,rotation:rand(-1,1),spin:rand(-2.5,2.5),bomb,type,hit:false})}}function splash(o){for(let i=0;i<11;i++){const a=rand(0,Math.PI*2),v=rand(35,160);particles.push({x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.7),max:.7,color:o.type.color})}}function hitSegment(ax,ay,bx,by,o){const dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((o.x-ax)*dx+(o.y-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(o.x-(ax+t*dx),o.y-(ay+t*dy))<o.r+3}function slash(a,b){if(state!=='playing')return;trails.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,life:.2});for(const o of objects){if(o.hit||!hitSegment(a.x,a.y,b.x,b.y,o))continue;o.hit=true;if(o.bomb){window.MYWorldGameSound?.effect('bomb');end(true);return}score+=10;scoreEl.textContent=score;splash(o);window.MYWorldGameSound?.effect('slice')}}function pos(e){const rect=c.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height}}c.addEventListener('pointerdown',e=>{if(state!=='playing')return;e.preventDefault();pointer=true;previous=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!pointer||state!=='playing')return;e.preventDefault();const p=pos(e);slash(previous,p);previous=p});function release(){pointer=false;previous=null}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);c.addEventListener('lostpointercapture',release);window.addEventListener('blur',()=>{if(state==='playing')end(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')end(false)});function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff07';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(40+i*47,65+i%3*150,25,0,Math.PI*2);ctx.fill()}for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rotation);ctx.shadowColor='#0009';ctx.shadowBlur=8;if(o.bomb){ctx.fillStyle='#252d40';ctx.beginPath();ctx.arc(0,0,23,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7a94c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,-17);ctx.quadraticCurveTo(20,-33,27,-24);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 25px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,1)}else{const col=o.type.color;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,2,25,26,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(-9,-8,7,11,-.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4dbd62';ctx.beginPath();ctx.ellipse(6,-26,10,5,-.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8d5b2e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(2,-30);ctx.stroke();if(o.type.emoji==='🍉'){ctx.fillStyle='#24884b';ctx.lineWidth=5;ctx.strokeStyle='#24884b';ctx.beginPath();ctx.arc(0,2,24,0,Math.PI*2);ctx.stroke();for(let i=0;i<5;i++){ctx.fillStyle='#322d35';ctx.beginPath();ctx.ellipse(Math.cos(i*1.25)*11,Math.sin(i*1.25)*11+3,2,4,i,0,Math.PI*2);ctx.fill()}}}ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.lineWidth=6;ctx.lineCap='round';for(const t of trails){ctx.globalAlpha=Math.max(0,t.life/.2);ctx.strokeStyle='#a7fff0';ctx.shadowBlur=14;ctx.shadowColor='#39e4d2';ctx.beginPath();ctx.moveTo(t.ax,t.ay);ctx.lineTo(t.bx,t.by);ctx.stroke()}ctx.shadowBlur=0;ctx.globalAlpha=1}function loop(now){if(state!=='playing')return;const dt=Math.min((now-last)/1000,.045);last=now;elapsed+=dt;time=Math.max(0,60-elapsed);timeEl.textContent=Math.ceil(time);spawn+=dt;if(spawn>Math.max(.4,.85-elapsed*.004)){spawn=0;spawnFruit()}for(const o of objects){o.vy+=630*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rotation+=o.spin*dt}objects=objects.filter(o=>!o.hit&&o.y<H+70);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const t of trails)t.life-=dt;trails=trails.filter(t=>t.life>0);draw();if(time<=0){end(false);return}requestAnimationFrame(loop)}startBtn.addEventListener('click',start);draw()})()</script><script src="./game-sound.js" defer></script></body></html>
