<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Progress</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#17345f;font:15px system-ui}header{background:#174ba5;color:white;padding:20px}header a{color:white}main{max-width:700px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:18px;margin-bottom:14px}label{display:block;margin:10px 0}input,select{width:100%;padding:10px;border:1px solid #ccd9eb;border-radius:8px;font:inherit}button{background:#1758bd;color:white;border:0;border-radius:9px;padding:12px;margin:5px;cursor:pointer}canvas{max-width:100%;height:auto;border:1px solid #ccd9eb}article{padding:10px;border-bottom:1px solid #ddd}small{color:#60738d}@media print{header,form,button,small{display:none}body,section{background:white}canvas{width:100mm;height:150mm;border:0}}</style><header><a href="./index.html">← MY WORLD</a><h1>Business Progress</h1></header><main><section><h2 id="summary"></h2><label>Monthly profit target ₹<input id="target" type="number" min="0" step=".01" value="0"></label><p id="progress"></p><label>View month<input id="month" type="month"></label></section><section><form id="f"><label>Date<input id="date" type="date" required></label><label>Type<select id="type"><option value="in">Sales / Income</option><option value="out">Cost / Expense</option></select></label><label>Description<input id="desc" required></label><label>Amount ₹<input id="amount" type="number" min=".01" step=".01" required></label><button>Save Entry</button></form></section><section><h2>History</h2><div id="list"></div></section><small>Records saved only on this device. Profit is an estimate based on entered income and expenses.</small></main><script>const $=id=>document.getElementById(id),key="mw-business-progress";let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]');$('target').value=localStorage.getItem(key+'-target')||0}catch{}const d=new Date(),today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');$('date').value=today;$('month').value=today.slice(0,7);function render(){const a=rows.filter(r=>r.date.startsWith($('month').value)),income=a.filter(r=>r.type==='in').reduce((s,r)=>s+r.amount,0),expense=a.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount,0),net=income-expense,target=Number($('target').value);$('summary').textContent='Income ₹'+income.toFixed(2)+' | Expense ₹'+expense.toFixed(2)+' | Estimated profit ₹'+net.toFixed(2);$('progress').textContent=target>0?'Target progress: '+(net/target*100).toFixed(1)+'%':'Set your monthly target';$('list').replaceChildren();for(const r of a){const p=document.createElement('article');p.textContent=r.date+' • '+r.desc+' • '+(r.type==='in'?'+':'−')+'₹'+r.amount.toFixed(2);const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>{if(confirm('Delete entry?')){const next=rows.filter(x=>x.id!==r.id);try{localStorage.setItem(key,JSON.stringify(next));rows=next;render()}catch{alert('Save failed')}}};p.append(b);$('list').append(p)}}$('target').onchange=()=>{try{localStorage.setItem(key+'-target',$('target').value)}catch{}render()};$('month').onchange=render;$('f').onsubmit=e=>{e.preventDefault();const next=[{id:crypto.randomUUID(),date:$('date').value,type:$('type').value,desc:$('desc').value,amount:Number($('amount').value)},...rows];try{localStorage.setItem(key,JSON.stringify(next));rows=next;$('desc').value=$('amount').value='';$('month').value=$('date').value.slice(0,7);render()}catch{alert('Save failed')}};render();</script></html>
