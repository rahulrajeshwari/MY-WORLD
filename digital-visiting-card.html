<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1955b7"><title>Digital Visiting Card | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7ff;color:#183057;font-family:system-ui,'Noto Sans Devanagari',sans-serif}header{background:white;border-bottom:1px solid #e0e8f7;padding:16px;display:flex;justify-content:space-between}a{color:#1d55b8;text-decoration:none}main{max-width:980px;margin:25px auto;padding:0 15px}h1{font-size:26px;margin:0}p{color:#64758d;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:white;border:1px solid #e0e8f7;border-radius:18px;padding:19px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,textarea,select{width:100%;border:1px solid #cdd9ed;border-radius:10px;padding:11px;font:inherit}textarea{resize:vertical;min-height:65px}button{width:100%;padding:14px;background:#235fc7;border:0;border-radius:12px;color:white;font:700 15px system-ui;cursor:pointer;margin-top:15px}canvas{width:100%;display:block;border-radius:12px;box-shadow:0 8px 22px #1e3d741a}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="./index.html">← MY WORLD</a><b>💳 Digital Card</b></header><main><h1>Free Digital Visiting Card</h1><p>अपना नाम, दुकान, मोबाइल नंबर और पता डालकर Professional Visiting Card बनाएँ।</p><div class="grid"><section class="panel"><label>Business / Shop Name *</label><input id="business" maxlength="65" placeholder="जैसे Rajeshwar Mobile"><label>Your Name</label><input id="name" maxlength="55" placeholder="आपका नाम"><label>Mobile Number *</label><input id="phone" maxlength="20" inputmode="tel" placeholder="मोबाइल नंबर"><label>Address *</label><textarea id="address" maxlength="150" placeholder="दुकान का पता"></textarea><label>Business / Services</label><input id="services" maxlength="90" placeholder="जैसे Mobile Repairing & Accessories"><label>Theme</label><select id="theme"><option value="blue">Blue & White</option><option value="navy">Navy & Gold</option><option value="sky">Sky Blue</option></select><button id="download">⬇ Download Card (PNG)</button><p>Free • No Login • आपकी जानकारी सर्वर पर नहीं भेजी जाती।</p></section><section class="panel"><canvas id="card" width="1000" height="620" aria-label="Digital visiting card preview"></canvas><p style="text-align:center">Live Preview</p></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('card'),g=c.getContext('2d'),pal={blue:['#10336c','#1f61c9','#d4e9ff'],navy:['#0b1c39','#b58a3c','#fff1c4'],sky:['#0a568d','#1c94d0','#d8f6ff']};function fit(text,max,width){let size=max;do{g.font='800 '+size+'px system-ui,sans-serif';if(g.measureText(text).width<=width)break;size-=2}while(size>19);return size}function line(t,x,y,size,color,weight='600'){g.textAlign='left';g.fillStyle=color;g.font=weight+' '+size+'px system-ui,sans-serif';g.fillText(t,x,y)}function wrap(text,x,y,max,size,color,limit=2){g.font='500 '+size+'px system-ui,sans-serif';let row='',lines=[];for(const word of String(text).split(/\s+/)){const next=row?row+' '+word:word;if(g.measureText(next).width>max&&row){lines.push(row);row=word}else row=next}if(row)lines.push(row);lines.slice(0,limit).forEach((v,i)=>line(v,x,y+i*(size+13),size,color,'500'))}function render(){const [dark,accent,light]=pal[$('theme').value];g.fillStyle='#fff';g.fillRect(0,0,1000,620);g.fillStyle=dark;g.fillRect(0,0,1000,200);g.fillStyle=accent;g.fillRect(0,193,1000,9);g.beginPath();g.arc(920,30,220,0,Math.PI*2);g.fillStyle='#ffffff12';g.fill();const business=$('business').value.trim()||'YOUR BUSINESS NAME';line(business,65,111,fit(business,59,855),'#fff','800');line(($('services').value.trim()||'Your Products & Services').slice(0,100),68,164,26,light);line(($('name').value.trim()||'Your Name'),65,284,38,dark,'800');g.fillStyle=accent;g.fillRect(65,308,115,5);line('☎',65,383,31,accent);line($('phone').value.trim()||'Your Mobile Number',119,383,31,dark);line('⌖',65,463,35,accent);wrap($('address').value.trim()||'Your Shop Address',120,461,810,27,dark,2);g.fillStyle=dark;g.fillRect(0,557,1000,63);line('Created with MY WORLD',65,599,23,'#fff','700')}document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',render));$('download').onclick=()=>{if(!$('business').value.trim()||!$('phone').value.trim()||!$('address').value.trim()){alert('Business Name, Mobile Number और Address भरें।');return}render();const a=document.createElement('a');a.download='MY-WORLD-Visiting-Card.png';a.href=c.toDataURL('image/png');a.click()};render()})();</script></body></html>
