<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203b91"><title>MY WORLD AI Chat</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#f3f6ff;color:#1c2d56}header{background:linear-gradient(125deg,#17317c,#546be6);padding:25px 18px 34px;color:#fff}header a{color:white;text-decoration:none;font-size:13px}header h1{margin:20px 0 8px;font-size:29px}header p{font-size:13px;line-height:1.7;color:#e9edff}main{max-width:800px;margin:22px auto;padding:0 15px 55px}.hero{background:white;border-radius:22px;padding:25px;box-shadow:0 12px 32px #20387d12;border:1px solid #e1e7fa}.robot{font-size:46px}.hero h2{margin:12px 0 8px;font-size:23px}.hero p{color:#67738e;font-size:14px;line-height:1.8}.primary{display:block;background:#3158cf;color:white;text-align:center;border-radius:13px;padding:15px;text-decoration:none;font-weight:800;margin:22px 0 12px}.note{font-size:12px;color:#71809d}.heading{margin:25px 0 13px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e2e8fa;border-radius:16px;padding:16px}.card h3{font-size:15px;margin:0 0 8px}.card p{font-size:12px;line-height:1.6;color:#687791}.card button{border:1px solid #c6d1f7;background:#eef2ff;color:#294aa9;border-radius:10px;padding:10px;width:100%;font-weight:750;cursor:pointer}footer{text-align:center;color:#8490aa;font-size:12px;padding:25px}@media(max-width:470px){.grid{grid-template-columns:1fr}header h1{font-size:25px}}</style></head><body><header><a href="./index.html">← MY WORLD Home</a><h1>🤖 MY WORLD AI Chat</h1><p>Your smart AI companion.</p></header><main><section class="hero"><div class="robot">🤖</div><h2>MY WORLD AI Assistant</h2><p>Smart assistance, simplified.</p><a class="primary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">💬 Start AI Chat ↗</a></section><p class="note" style="margin-top:24px">🔒 सावधानी: OTP, पासवर्ड, बैंक PIN या अन्य संवेदनशील जानकारी किसी चैट में शेयर न करें। AI के जवाबों में गलती हो सकती है।</p></main><footer>MY WORLD • AI Chat</footer><script>document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',async()=>{const val=b.dataset.prompt;try{await navigator.clipboard.writeText(val);b.textContent='✓ कॉपी हो गया'}catch{const t=document.createElement('textarea');t.value=val;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();b.textContent='✓ कॉपी हो गया'}setTimeout(()=>b.textContent='📋 सवाल कॉपी करें',1800)}))</script></body></html>
