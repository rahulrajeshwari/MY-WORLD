<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Profile | MY WORLD</title>
<link rel="stylesheet" href="./cloud.css">
</head>
<body>
<main class="cloud">
  <a href="./index.html">← MY WORLD</a>
  <h1>Customer Profile</h1>
  <p id="account-status" role="status">Checking sign-in…</p>
  <a id="account-login" href="./index.html#login" hidden>Sign in with mobile OTP</a>
  <form id="profile-form" hidden>
    <p>Verified mobile number <strong id="verified-phone"></strong></p>
    <fieldset id="profile-fields" disabled>
      <legend>Profile details</legend>
      <label>Name <input name="name" autocomplete="name" maxlength="80" required></label>
      <label>Email (optional) <input name="email" type="email" autocomplete="email" maxlength="254"></label>
      <button>Save profile</button>
    </fieldset>
    <button id="account-logout" type="button">Sign out</button>
  </form>
  <p><a id="admin-link" href="./admin.html" hidden>Admin Dashboard</a></p>
</main>
<script type="module" src="./account.js"></script>
</body>
</html>
