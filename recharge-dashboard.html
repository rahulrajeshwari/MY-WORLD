<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD Recharge</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f6ff;color:#173253;font:16px system-ui}header{background:#164ca0;color:white;padding:22px}header a{color:white}main{max-width:600px;margin:auto;padding:16px}section{background:white;border:1px solid #dce6f5;border-radius:18px;padding:18px;margin:14px 0}.balance{background:#14345f;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{min-height:72px}button,input,select{font:inherit;padding:12px;border:1px solid #cbd9ec;border-radius:10px;background:white;color:inherit}button:disabled{opacity:.65}input,select,.wide{width:100%;margin:8px 0}.tabs{display:flex;gap:8px}.tabs a{flex:1;text-align:center;padding:12px;background:#e0ebff;border-radius:12px;color:#164ca0;text-decoration:none}.tabs a.active{background:#164ca0;color:white}small{display:block;opacity:.8}h1,h2,p{margin:8px 0}h2{font-size:19px}.primary{background:#185bd8;color:white}.notice{color:#825100;background:#fff3d6;padding:12px;border-radius:12px}footer{text-align:center;padding:20px}</style><header><a href="./index.html" id="back"></a><h1 id="title"></h1><small id="subtitle"></small></header><main><nav class="tabs"><a href="?mode=user" id="user"></a><a href="?mode=retailer" id="retailer"></a></nav><p class="notice" id="notice"></p><div id="body"></div></main><footer>MY WORLD</footer><script>const en=localStorage.getItem('myworld-lang')==='en',r=new URLSearchParams(location.search).get('mode')==='retailer',t=(h,e)=>en?e:h;document.documentElement.lang=en?'en':'hi';const $=id=>document.getElementById(id);$('back').textContent=t('← मुख्य पृष्ठ','← Home');$('title').textContent=r?t('माय वर्ल्ड रिटेलर पार्टनर','MY WORLD Retailer Partner'):t('माय वर्ल्ड रिचार्ज','MY WORLD Recharge');$('subtitle').textContent=t('रिचार्ज और बिल भुगतान','Recharge & Bill Payments');$('user').textContent=t('ग्राहक','User');$('retailer').textContent=t('रिटेलर','Retailer');$(r?'retailer':'user').classList.add('active');$('notice').textContent=t('जल्द उपलब्ध • केवल डिजाइन। कोई भुगतान या रिचार्ज नहीं होगा।','Coming Soon • Design preview only. No payments or recharges.');const grid=items=>'<div class="grid">'+items.map(x=>'<button disabled>'+x+'</button>').join('')+'</div>';const btn=x=>'<button class="wide" disabled>'+x+'</button>';const balance=r?t('रिटेलर वॉलेट','Retailer Wallet'):t('कैशबैक बैलेंस','Cashback Balance');$('body').innerHTML='<section class="balance"><small>'+balance+'</small><h1>₹ —</h1>'+(r?'<p>'+t('आज का कमीशन','Today’s commission')+' ₹ —</p><p>'+t('मासिक कमीशन','Monthly commission')+' ₹ —</p>'+btn(t('पैसे जोड़ें','Add Money')):'')+'</section><section><h2>'+t('मोबाइल रिचार्ज','Mobile Recharge')+'</h2><label>'+t('मोबाइल नंबर','Mobile number')+'<input disabled inputmode="numeric" placeholder="0000000000"></label><label>'+t('ऑपरेटर','Operator')+'<select disabled><option>Jio / Airtel / Vi / BSNL</option></select></label><label>'+t('रिचार्ज राशि','Recharge amount')+'<input disabled placeholder="₹"></label>'+btn(t('प्लान देखें','Browse Plans'))+'<button disabled class="wide primary">'+(r?t('वॉलेट से रिचार्ज','Recharge from Wallet'):t('यूपीआई से भुगतान','Pay with UPI'))+'</button></section><section><h2>'+t('अन्य सेवाएँ','Other Services')+'</h2>'+grid([t('डीटीएच','DTH'),t('पोस्टपेड','Postpaid'),t('बिजली','Electricity'),t('गैस','Gas'),t('फास्टैग','FASTag'),t('ब्रॉडबैंड','Broadband'),t('पानी','Water')])+'</section><section><h2>'+t('मेरा खाता','My Account')+'</h2>'+grid(r?[t('कमीशन चार्ट','Commission Chart'),t('लेनदेन','Transactions'),t('सेटलमेंट','Settlement'),t('ग्राहक','Customers'),t('रिपोर्ट','Reports'),t('केवाईसी','KYC'),t('सहायता','Support')]:[t('रिचार्ज इतिहास','Recharge History'),t('कैशबैक इतिहास','Cashback History'),t('ऑफर','Offers'),t('रिफंड स्थिति','Refund Status'),t('डिजिटल रसीद','Digital Receipt'),t('सहायता','Support')])+'</section>';</script></html>
