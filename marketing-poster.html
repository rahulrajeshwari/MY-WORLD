<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b60"><title>Free Marketing Poster Maker | MY WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#172442;font-family:system-ui,'Noto Sans Devanagari',sans-serif}header{background:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce5f5}header a{color:#245bc0;text-decoration:none}main{max-width:1000px;margin:auto;padding:20px 14px 50px}h1{font-size:25px;margin:5px 0}p{color:#62718a;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:20px}.panel{background:#fff;padding:18px;border:1px solid #e1e8f3;border-radius:18px}label{display:block;font-size:12px;font-weight:750;margin:13px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #ced9ed;border-radius:10px;font:inherit;background:#fff}textarea{resize:vertical;min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}canvas{display:block;width:100%;max-width:460px;margin:auto;border-radius:12px;box-shadow:0 8px 25px #13295b25}button{background:#285bc6;color:white;border:0;border-radius:12px;padding:13px 18px;font:700 14px system-ui;cursor:pointer;width:100%;margin-top:14px}.note{font-size:11px;color:#7a879b}@media(max-width:730px){.layout{grid-template-columns:1fr}.two{grid-template-columns:1fr 1fr}}</style></head><body><header><a href="./index.html">← MY WORLD</a><b>🎨 Poster Maker</b></header><main><h1>Free Marketing Poster Maker</h1><p>अपनी Shop या Product का पोस्टर बनाएँ • नाम, मोबाइल नंबर और पता जोड़ें • PNG डाउनलोड करें</p><div class="layout"><section class="panel"><label>Poster Type</label><select id="type"><option value="shop">Shop Promotion</option><option value="product">Product Offer</option><option value="sale">Special Sale</option></select><label>Shop / Business Name *</label><input id="name" maxlength="70" placeholder="जैसे Rajeshwar Mobile"><div class="two"><div><label>Mobile Number *</label><input id="phone" inputmode="tel" maxlength="20" placeholder="मोबाइल नंबर"></div><div><label>Offer / Price</label><input id="offer" maxlength="50" placeholder="जैसे 20% OFF"></div></div><label>Shop Address *</label><textarea id="address" maxlength="180" placeholder="दुकान का पूरा पता"></textarea><label>Product / Service Name</label><input id="product" maxlength="85" placeholder="जैसे Mobile Accessories"><label>Short Message</label><input id="message" maxlength="95" placeholder="जैसे Best Quality • Great Price"><label>Product / Shop Photo (Optional)</label><input id="photo" type="file" accept="image/*"><label>Poster Theme</label><select id="theme"><option value="blue">Professional Blue</option><option value="purple">Purple</option><option value="green">Green</option><option value="red">Red Sale</option></select><button id="download">⬇ Download Free Poster (PNG)</button><p class="note">कोई लॉगिन या भुगतान नहीं। आपकी जानकारी पोस्टर बनाने के लिए इसी डिवाइस में उपयोग होती है, सर्वर पर नहीं भेजी जाती।</p></section><section class="panel"><canvas id="poster" width="900" height="1200" aria-label="Marketing poster preview"></canvas><p style="text-align:center">Live Poster Preview</p></section></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('poster'),g=c.getContext('2d');let picture=null;const themes={blue:['#0c1c4b','#235acb','#8fceff'],purple:['#25134c','#7844cd','#e2b5ff'],green:['#083c37','#0b947d','#a1f2cb'],red:['#521522','#e23d47','#ffc1a2']};function lines(text,max){const out=[];let row='';for(const word of String(text).split(/\s+/)){if(!word)continue;const next=row?row+' '+word:word;if(g.measureText(next).width>max&&row){out.push(row);row=word}else row=next}if(row)out.push(row);return out}function wrap(text,x,y,max,size,color='#fff',weight='700',line=1.32,limit=3){g.fillStyle=color;g.font=weight+' '+size+'px system-ui, sans-serif';g.textAlign='center';const arr=lines(text,max).slice(0,limit);arr.forEach((v,i)=>g.fillText(v,x,y+i*size*line));return y+arr.length*size*line}function round(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function render(){const t=themes[$('theme').value],grad=g.createLinearGradient(0,0,900,1200);grad.addColorStop(0,t[0]);grad.addColorStop(1,t[1]);g.fillStyle=grad;g.fillRect(0,0,900,1200);g.fillStyle='#ffffff0c';for(let i=0;i<9;i++){g.beginPath();g.arc(820-i*92,130+i*113,90+i*8,0,Math.PI*2);g.fill()}g.fillStyle=t[2];round(255,48,390,54,27);g.fill();wrap('MY WORLD  •  FREE POSTER MAKER',450,85,370,21,t[0],'800',1,1);const kind=$('type').value;wrap(kind==='shop'?'WELCOME TO OUR SHOP':kind==='product'?'FEATURED PRODUCT':'SPECIAL SALE',450,170,780,33,t[2],'800',1,1);let y=wrap($('name').value.trim()||'YOUR SHOP NAME',450,250,770,62,'#fff','900',1.13,3);y=Math.max(315,y+24);const label=$('product').value.trim()||(kind==='shop'?'BEST SERVICES & PRODUCTS':'YOUR PRODUCT');y=wrap(label,450,y,760,35,'#e6f0ff','700',1.18,2);const boxY=Math.max(440,Math.min(y+35,510));g.fillStyle='#ffffff';round(85,boxY,730,365,28);g.fill();if(picture){const iw=picture.width,ih=picture.height,scale=Math.min(700/iw,335/ih);g.save();round(100,boxY+15,700,335,18);g.clip();g.drawImage(picture,450-iw*scale/2,boxY+182-ih*scale/2,iw*scale,ih*scale);g.restore()}else{g.textAlign='center';g.font='140px system-ui';g.fillText(kind==='shop'?'🏬':kind==='sale'?'🎉':'🛍️',450,boxY+245)}const offer=$('offer').value.trim();if(offer){g.fillStyle=t[2];round(190,boxY+385,520,94,25);g.fill();wrap(offer,450,boxY+447,490,48,t[0],'900',1,1)}let base=offer?boxY+555:boxY+485;wrap($('message').value.trim()||'QUALITY • TRUST • GREAT SERVICE',450,base,760,29,'#fff','700',1.2,2);base+=90;g.fillStyle='#ffffff1e';round(65,base,770,175,24);g.fill();wrap('📞 '+($('phone').value.trim()||'YOUR MOBILE NUMBER'),450,base+54,730,33,'#fff','800',1.1,1);wrap('📍 '+($('address').value.trim()||'YOUR SHOP ADDRESS'),450,base+106,720,25,'#eaf3ff','600',1.28,2);g.font='600 18px system-ui';g.fillStyle=t[2];g.textAlign='center';g.fillText('Made with MY WORLD',450,1160)}document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',render));$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f){picture=null;render();return}if(!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{picture=im;URL.revokeObjectURL(url);render()};im.onerror=()=>URL.revokeObjectURL(url);im.src=url});$('download').addEventListener('click',()=>{if(!$('name').value.trim()||!$('phone').value.trim()||!$('address').value.trim()){alert('कृपया Shop Name, Mobile Number और Address भरें।');return}render();const a=document.createElement('a');a.download='MY-WORLD-Marketing-Poster.png';a.href=c.toDataURL('image/png');a.click()});render()})();</script></body></html>
