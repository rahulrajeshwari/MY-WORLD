<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY WORLD Creator Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fc;color:#17294b;font:16px system-ui}main{max-width:600px;margin:auto;padding:16px}header{background:#14234c;color:white;padding:18px}header a{color:white}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bacbe5;border-radius:9px;width:100%}button{background:#174ca5;color:white;margin:6px 0;cursor:pointer}canvas{width:100%;height:auto;border-radius:12px;margin-top:12px}small{color:#526581}</style></head><body><header><a href="./index.html">← MY WORLD</a><h2>Creator Studio</h2>Create • Customize • Share — FREE</header><main><label for="kind">Choose your design</label><select id="kind"></select><label for="name">Your name / business name</label><input id="name" maxlength="60"><label for="message">Message / details</label><textarea id="message" maxlength="240" rows="4"></textarea><label for="photo">Add your photo (optional)</label><input id="photo" type="file" accept="image/*"><label for="theme">Theme</label><select id="theme"><option value="gold">Black Gold</option><option value="blue">Royal Blue</option><option value="silver">Silver</option><option value="pink">Rose</option></select><button id="make">Create / Update Card</button><canvas id="card" width="1080" height="1350" aria-label="Card preview"></canvas><button id="save">Download PNG</button><button id="share">Share Card</button><p id="status" role="status"></p><small>Promotional designs only. VIP and certificates do not grant paid benefits or official credentials. Photos stay on your device.</small></main><script>const $=id=>document.getElementById(id),types=[['VIP Member Card','I AM PART OF MY WORLD'],['Birthday Poster','Happy Birthday!'],['Digital Visiting Card','Connect with me'],['Festival Poster','Warm wishes'],['Membership Certificate','MY WORLD Community Member'],['Daily Status','Make today amazing'],['Resume / Biodata','My profile'],['Business Promotion','Special offer'],['MYGRAM Profile Card','Connect with me on MYGRAM'],['Game Challenge','Can you beat my score?'],['Invite Friends','Join MY WORLD today']];for(const [n] of types){const o=document.createElement('option');o.textContent=n;$('kind').append(o)}let img=null;const c=$('card'),g=c.getContext('2d'),themes={gold:['#10182d','#e8c36b','#ffffff'],blue:['#153a85','#b8d7ff','#ffffff'],silver:['#e7edf5','#344e70','#17294b'],pink:['#651b45','#ffc9df','#ffffff']};function line(t,y,size,color){g.font='600 '+size+'px system-ui';g.fillStyle=color;g.textAlign='center';g.fillText(t,540,y,920)}function wrap(t,y,size,color){g.font=size+'px system-ui';g.fillStyle=color;g.textAlign='center';let row='';for(const word of t.split(/\s+/)){if(g.measureText(row+' '+word).width>880&&row){g.fillText(row,540,y,880);y+=size*1.4;row=word}else row+=(row?' ':'')+word}if(row)g.fillText(row,540,y,880)}function draw(){const [bg,accent,fg]=themes[$('theme').value],type=types[$('kind').selectedIndex];g.fillStyle=bg;g.fillRect(0,0,1080,1350);g.strokeStyle=accent;g.lineWidth=5;g.strokeRect(35,35,1010,1280);line('MY WORLD',130,64,accent);line(type[0].toUpperCase(),230,48,fg);g.save();g.beginPath();g.arc(540,480,180,0,Math.PI*2);g.clip();g.fillStyle=accent;g.fillRect(360,300,360,360);if(img){const z=Math.min(img.width,img.height);g.drawImage(img,(img.width-z)/2,(img.height-z)/2,z,z,360,300,360,360)}else{line('MW',525,110,bg)}g.restore();line($('name').value.trim()||'YOUR NAME',750,64,fg);wrap($('message').value.trim()||type[1],850,40,fg);line('Created with MY WORLD',1140,42,accent);line('rahulrajeshwari.github.io/MY-WORLD/',1200,30,fg);line('Founded by Mr. Rahul Kumawat',1260,30,fg)}$('photo').onchange=async()=>{const f=$('photo').files[0];if(!f)return;const u=URL.createObjectURL(f);try{const i=new Image();i.src=u;await i.decode();img=i;draw()}catch{$('status').textContent='Unable to open photo'}finally{URL.revokeObjectURL(u)}};for(const id of ['kind','theme','name','message'])$(id).addEventListener('input',draw);$('make').onclick=draw;$('save').onclick=()=>{draw();const a=document.createElement('a');a.download='MY-WORLD-card.png';a.href=c.toDataURL('image/png');a.click()};$('share').onclick=()=>{draw();c.toBlob(async b=>{try{const f=new File([b],'MY-WORLD-card.png',{type:'image/png'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],text:'Created with MY WORLD https://rahulrajeshwari.github.io/MY-WORLD/'});else $('save').click()}catch(e){if(e.name!=='AbortError')$('status').textContent='Share unavailable. Download instead.'}},'image/png')};draw();</script><script src="./voice-assist.js" defer></script></body></html>
